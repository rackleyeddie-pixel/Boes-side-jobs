<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs — Level 6 Dive Bar</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b10;font-family:monospace;touch-action:none}body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;height:100svh}#wrap{width:min(100vw,430px);height:calc(100svh - 132px);padding:4px 6px 0}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#120c12;border-radius:15px;display:block}#ui{width:min(100vw,430px);height:132px;flex:0 0 132px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 8px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#321722,#12090d);border-top:4px solid #7c3b42;box-shadow:inset 0 3px #c77d65}.group{display:flex;gap:8px}.btn{border:3px solid #241017;box-shadow:0 5px 0 #050304,inset 0 2px #ffffff33;background:linear-gradient(#a14b51,#642633);color:#fff1cf;font-weight:900;text-shadow:0 2px #321017;display:flex;align-items:center;justify-content:center;touch-action:none}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #050304}.move{width:70px;height:72px;border-radius:14px;font-size:29px}.round{width:82px;height:82px;border-radius:50%;font-size:12px}.jump{background:linear-gradient(#c89249,#7b4725)}.drink{background:linear-gradient(#d2a33c,#8d5d19);color:#271504}@media(max-width:370px){.move{width:61px}.round{width:74px;height:76px}.group{gap:5px}}</style></head><body><div id="wrap"><canvas id="game" width="390" height="650"></canvas></div><div id="ui"><div class="group"><div id="left" class="btn move">◀</div><div id="right" class="btn move">▶</div></div><div class="group"><div id="drink" class="btn round drink">CHUG</div><div id="jump" class="btn round jump">JUMP</div></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=390,H=650,G=526,WORLD=1900,params=new URLSearchParams(location.search),test=params.get('test')==='1';const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='900 '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};let left=0,right=0,tick=0,cam=0,hp=4,cash=1200,state='play',msg='LAST CALL SIDE JOB — FINISH THE BEERS!',mt=180,inv=120,drinkFx=0,perfect=1;const p={x:70,y:G-42,vx:0,vy:0,on:1,dir:1};const beers=[270,540,810,1080,1350].map((x,i)=>({x,n:0,done:0,label:['COLD ONE','HOUSE CAN','TALL BOY','BAR SPECIAL','LAST CALL'][i]}));const guards=[{x:630,wake:210},{x:1120,wake:390},{x:1570,wake:570}];const sx=x=>x-cam;function clear(){left=right=0}window.addEventListener('blur',clear);function bind(id,d){let e=document.getElementById(id);e.addEventListener('pointerdown',q=>{q.preventDefault();d<0?left=1:right=1});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,q=>{q.preventDefault();d<0?left=0:right=0}))}bind('left',-1);bind('right',1);jump.addEventListener('pointerdown',e=>{e.preventDefault();if(p.on){p.vy=-9.5;p.on=0}});drink.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='win'){location.href='boes-side-jobs-through-level5.html';return}chug()});function chug(){if(state!=='play')return;let b=beers.find(b=>!b.done&&Math.abs(p.x-b.x)<72);if(!b){msg='GET TO A BEER AT THE BAR';mt=48;return}b.n++;drinkFx=26;msg='CHUG '+b.n+'/5';mt=38;if(b.n>=5){b.done=1;cash+=75;msg='BEER FINISHED! +$75';mt=70;if(beers.every(x=>x.done)){state='win';cash+=perfect?250:100;msg=perfect?'PERFECT LAST CALL! +$250':'LAST CALL COMPLETE! +$100';mt=9999}}}function hit(){if(test||inv||state!=='play')return;hp--;perfect=0;inv=100;msg='SECURITY SPOTTED YOU — MOVE!';mt=60;p.vx=p.x<cam+195?-5:5;if(hp<=0){hp=4;inv=180;p.x=Math.max(50,cam+70);msg='BOUNCED BACK — KEEP MOVING!';mt=80}}function update(){tick++;if(mt)mt--;if(inv)inv--;if(drinkFx)drinkFx--;if(state!=='play')return;const acc=p.on?.48:.28,max=4.3;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.78:.94;const oy=p.y;p.x+=p.vx;p.vy+=.52;p.y+=p.vy;p.x=Math.max(22,Math.min(WORLD-45,p.x));p.on=0;if(p.vy>=0&&oy+42<=G+5&&p.y+42>=G){p.y=G-42;p.vy=0;p.on=1}cam=Math.max(0,Math.min(WORLD-W,p.x-150));for(const a of guards){if(tick<a.wake)continue;let d=p.x-a.x;if(Math.abs(d)<520)a.x+=Math.sign(d)*1.35;a.x=Math.max(30,Math.min(WORLD-30,a.x));if(Math.abs(p.x-a.x)<28&&p.on)hit()}}function neon(s,x,y,col){g.save();g.shadowBlur=14;g.shadowColor=col;T(s,sx(x),y,17,col,'center');g.restore()}function background(){R(0,0,W,H,'#160f16');R(0,110,W,416,'#2a171b');for(let x=-cam%110-20;x<W;x+=110){R(x,125,2,370,'#3b2324');R(x+3,125,1,370,'#170d10')}R(0,492,W,34,'#35231c');for(let x=-cam%48;x<W;x+=48)R(x,492,2,34,'#151010');neon('BOE’S LAST CALL',250,155,'#ff4f74');neon('COLD BEER',690,190,'#65dfff');neon('POOL',1110,155,'#76ff87');neon('JUKEBOX',1530,185,'#ffb23d');for(let x=160;x<WORLD;x+=360){let q=sx(x);R(q,245,96,66,'#213a2d');R(q+5,250,86,56,'#315b43');R(q+42,250,4,56,'#d5d1b0');R(q+5,275,86,4,'#d5d1b0');R(q+12,318,8,82,'#5a3521');R(q+76,318,8,82,'#5a3521')}let j=sx(1460);R(j,294,62,150,'#4b2430');R(j+6,300,50,72,'#da6d35');R(j+12,307,38,57,'#241527');R(j+8,379,46,57,'#754030');for(let i=0;i<4;i++)R(j+14+i*9,388,5,30,['#f75','#7df','#fd7','#8f8'][i]);let pool=sx(930);R(pool,392,190,16,'#42291e');R(pool+10,350,170,48,'#28614c');R(pool+17,356,156,36,'#35775d');R(pool+20,410,10,80,'#3b271e');R(pool+160,410,10,80,'#3b271e');for(let i=0;i<8;i++){let q=sx(410+i*180);R(q,438,26,12,'#6b3c2b');R(q+8,450,10,42,'#493026')}}function bartender(){let x=sx(115),y=G-74;R(x-35,382,250,22,'#5b321e');R(x-35,404,250,88,'#3d2318');for(let i=0;i<7;i++){R(x-20+i*30,330,12,42,i%2?'#735c28':'#4b703a');R(x-17+i*30,321,6,12,'#d2c27c')}R(x+45,y+25,24,38,'#6d2339');R(x+48,y+4,18,23,'#d49b77');R(x+45,y,24,8,'#4b271b');R(x+40,y+15,8,32,'#d49b77');R(x+67,y+15,8,32,'#d49b77');T('BARTENDER',x+58,y-8,8,'#ffd98b','center')}function beer(b){let q=sx(b.x);if(q<-40||q>430)return;R(q-18,G-92,60,26,'#1a1012');T(b.done?'EMPTY':b.label,q+12,G-76,7,b.done?'#888':'#ffe27a','center');R(q,G-65,22,42,b.done?'#777':'#d6a633');R(q+4,G-59,14,28,b.done?'#aaa':'#f4cf54');R(q+22,G-55,8,19,'#a57d34');T((b.done?'✓':b.n+'/5'),q+11,G-30,10,b.done?'#82ff91':'#fff','center')}function guy(x,security=false){let q=sx(x),y=G-47;R(q+7,y+35,8,12,'#202020');R(q+21,y+35,8,12,'#202020');R(q+7,y+22,8,15,'#303a48');R(q+21,y+22,8,15,'#303a48');R(q+5,y+10,27,17,security?'#171b24':'#ded6c9');R(q+10,y,17,13,'#c98f6c');R(q+10,y+4,7,4,'#111');R(q+20,y+4,7,4,'#111');if(security){T('SEC',q+18,y+22,7,'#f1d85b','center');R(q+4,y+9,3,20,'#d5b84c')}}function hud(){R(7,7,376,91,'#27151a');R(12,12,366,81,'#5b2a30');T('LEVEL 6: BOE’S LAST CALL',22,33,12,'#ffe079');T('BEERS '+beers.filter(b=>b.done).length+'/5 • EACH TAKES 5 CHUGS',22,53,9,'#fff');T(test?'DONNY ★ TEST MODE':'♥ '+hp,22,76,10,test?'#ffe15a':'#ff7b7b');T('$'+cash,360,76,10,'#8cff9a','right');if(mt)T(msg,195,116,9,'#ffe27a','center')}function draw(){background();bartender();beers.forEach(beer);guards.forEach(a=>{if(tick>=a.wake)guy(a.x,true)});guy(p.x,false);if(drinkFx){T('GLUG!',sx(p.x)+16,G-78,12,'#ffe27a','center');for(let i=0;i<5;i++)R(sx(p.x)+5+i*6,G-68-(i%2)*5,3,3,'#f5c44c')}hud();if(state==='win'){R(35,185,320,225,'rgba(12,7,10,.92)');T('LAST CALL COMPLETE!',195,230,19,'#ffe36a','center');T(perfect?'BARROOM LEGEND':'MADE IT TO CLOSING',195,270,13,perfect?'#8cff95':'#fff','center');T('5 BEERS • 25 CHUGS',195,305,11,'#fff','center');T('SECURITY EVADED',195,333,10,'#ff9e73','center');T('TAP CHUG TO RETURN',195,380,10,'#ffe27a','center')}}function loop(){update();draw();requestAnimationFrame(loop)}loop()})();</script></body></
