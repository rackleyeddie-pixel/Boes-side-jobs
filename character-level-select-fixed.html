<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#15110d;color:#fff;font-family:monospace;overflow:hidden}body{display:flex;justify-content:center}.app{width:min(100vw,430px);height:100%;position:relative;background:linear-gradient(#8ec8ea 0 46%,#79a66c 46% 68%,#74553a 68%);overflow:hidden}.sun{position:absolute;right:48px;top:68px;width:42px;height:42px;border-radius:50%;background:#f4d45d}.cloud{position:absolute;background:#fff;height:14px;width:62px;top:95px;left:70px;box-shadow:18px -10px 0 2px #fff,38px -4px 0 0 #fff}.wood{background:#ad713a;border:7px solid #5a321b;box-shadow:inset 0 0 0 4px #c88b4b}.post{position:absolute;top:80px;left:62px;width:18px;height:200px;background:#5a321b}.post.r{left:auto;right:62px}.sign{position:absolute;top:105px;left:82px;right:82px;height:138px;padding-top:28px;text-align:center;font-family:Impact,Arial Black,sans-serif;font-size:37px;line-height:1.3;color:#2a170e}.sub{position:absolute;top:270px;left:48px;right:48px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#24150d}.chars{position:absolute;top:338px;left:26px;right:26px;display:flex;gap:18px}.card{flex:1;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;font-weight:900;color:#fff}.card.sel{outline:6px solid #ffe45f}.person{width:42px;height:66px;position:relative;margin-bottom:10px}.head{position:absolute;left:12px;top:7px;width:18px;height:18px;background:#d39c74}.hat{position:absolute;left:7px;top:2px;width:28px;height:7px;background:#b72f35}.body{position:absolute;left:8px;top:25px;width:26px;height:26px;background:#e7dfd4}.legs{position:absolute;left:10px;top:50px;width:8px;height:13px;background:#354a60;box-shadow:14px 0 0 #354a60}.donny .hat{background:#d5b42e}.donny .body{background:#b75237}.jordan .hat{background:#58616e}.jordan .body{background:#e3c83e}.prompt{position:absolute;top:500px;left:92px;right:92px;height:64px;display:flex;align-items:center;justify-content:center;color:#245c21;font-size:22px;font-weight:900}.hint{position:absolute;top:590px;width:100%;text-align:center;font-size:16px;font-weight:900}.levels{display:none;position:absolute;inset:70px 28px 118px;padding:18px;background:#ad713a;border:7px solid #5a321b;overflow:auto}.levels.show{display:block}.levels h2{text-align:center;color:#24150d;margin:0 0 12px}.lvl{width:100%;padding:14px 8px;margin:8px 0;border:4px solid #5a321b;background:#c48647;color:#24150d;font-weight:900;font-family:monospace}.lvl.sel{outline:5px solid #ffe45f}.back{margin-top:10px}.controls{position:absolute;bottom:0;left:0;right:0;height:106px;background:#17110d;border-top:4px solid #7a4b2c;display:flex;align-items:center;justify-content:space-around;padding:8px}.btn{height:68px;min-width:70px;border-radius:14px;border:3px solid #2c1a10;background:linear-gradient(#c58a4d,#8d542b);box-shadow:0 5px 0 #080605;font-weight:900;font-size:20px}.start{min-width:78px;font-size:14px}.jump{width:82px;height:82px;border-radius:50%;background:#cfe4ff}.work{width:82px;height:82px;border-radius:50%;font-size:14px}</style></head><body><div class="app"><div class="sun"></div><div class="cloud"></div><div class="post"></div><div class="post r"></div><div class="sign wood">BOE'S<br>SIDE JOBS</div><div class="sub wood">CHOOSE YOUR CHARACTER</div><div id="chars" class="chars"><div class="card wood sel"><div class="person"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div>BOE</div><div class="card wood donny"><div class="person"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div>DONNY</div><div class="card wood jordan"><div class="person"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div>JORDAN</div></div><div id="prompt" class="prompt wood">PRESS START</div><div id="hint" class="hint">◀ SELECT ▶</div><div id="levels" class="levels"><h2>SELECT LEVEL</h2><button class="lvl sel">LEVEL 1 — FENCE FIX</button><button class="lvl">LEVEL 2 — AUTO REPAIR</button><button class="lvl">LEVEL 3 — BACKYARD DECK</button><button class="lvl">LEVEL 4 — HIDE FROM THE BOSS</button><button class="lvl">LEVEL 5 — HIGH-RISE MASONRY</button><button class="lvl">LEVEL 6 — BOE'S LAST CALL</button><button id="back" class="lvl back">BACK TO CHARACTERS</button></div><div class="controls"><button id="left" class="btn">◀</button><button id="right" class="btn">▶</button><button class="btn work">WORK</button><button id="start" class="btn start">START</button><button class="btn jump">JUMP</button></div></div><script>(()=>{const cards=[...document.querySelectorAll('.card')],lvls=[...document.querySelectorAll('.lvl:not(.back)')],chars=document.getElementById('chars'),levels=document.getElementById('levels'),prompt=document.getElementById('prompt'),hint=document.getElementById('hint');let mode='char',ci=0,li=0;const names=['BOE','DONNY','JORDAN'];function rc(){cards.forEach((e,i)=>e.classList.toggle('sel',i===ci))}function rl(){lvls.forEach((e,i)=>e.classList.toggle('sel',i===li));lvls[li].scrollIntoView({block:'nearest'})}function move(d){if(mode==='char'){ci=(ci+d+3)%3;rc()}else{li=(li+d+6)%6;rl()}}left.addEventListener('click',()=>move(-1));right.addEventListener('click',()=>move(1));cards.forEach((e,i)=>e.addEventListener('click',()=>{ci=i;rc()}));lvls.forEach((e,i)=>e.addEventListener('click',()=>{li=i;rl()}));start.addEventListener('click',()=>{if(mode==='char'){mode='level';chars.style.display='none';prompt.style.display='none';hint.style.display='none';levels.classList.add('show');return}const n=names[ci];if(li===5){location.href='level6-divebar-patrons.html'+(n==='DONNY'?'?test=1':'')}else if(li===4){location.href='level5-with-level6.html?life=1'+(n==='DONNY'?'&test=1':'')}else{location.href='levels1-6-connected.html?chosenLevel='+(li+1)+'&chosenChar='+encodeURIComponent(n)}});back.addEventListener('click',()=>{mode='char';levels.classList.remove('show');chars.style.display='flex';prompt.style.display='flex';hint.style.display='block'});})();</script></body></html>
