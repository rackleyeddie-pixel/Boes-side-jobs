</head><body><div id="wrap"><canvas id="game" width="390" height="650"></canvas></div><div id="ui"><div class="group"><div id="left" class="btn move">◀</div><div id="right" class="btn move">▶</div></div><div class="group"><div id="drink" class="btn round drink">CHUG</div><div id="jump" class="btn round jump">JUMP</div></div></div><script>(()=>{document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});const c=document.getElementById('game'),g=c.getContext('2d'),W=390,H=650,G=526,WORLD=3000,test=new URLSearchParams(location.search).get('test')==='1';g.imageSmoothingEnabled=false;const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='900 '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};let left=0,right=0,tick=0,cam=0,hp=4,cash=1200,state='play',msg='LAST CALL — FINISH THE BEERS!',mt=180,inv=120,drinkFx=0,perfect=1,last=performance.now();const PH=60;const p={x:90,y:G-PH,vx:0,vy:0,on:1,dir:1};const beers=[420,920,1420,1920,2420].map((x,i)=>({x,n:0,done:0,label:['COLD ONE','HOUSE CAN','TALL BOY','BAR SPECIAL','LAST CALL'][i]}));const guards=[{x:760,wake:240},{x:1550,wake:450},{x:2550,wake:660}],sx=x=>x-cam;function clearMove(){left=right=0}window.addEventListener('blur',clearMove);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMove()});function bind(id,d){const e=document.getElementById(id);e.addEventListener('pointerdown',q=>{q.preventDefault();try{e.setPointerCapture(q.pointerId)}catch(_){};d<0?left=1:right=1},{passive:false});const up=q=>{q.preventDefault();d<0?left=0:right=0};e.addEventListener('pointerup',up,{passive:false});e.addEventListener('pointercancel',up,{passive:false});e.addEventListener('lostpointercapture',()=>{d<0?left=0:right=0})}bind('left',-1);bind('right',1);document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(p.on){p.vy=-9.5;p.on=0}},{passive:false});document.getElementById('drink').addEventListener('pointerdown',e=>{e.preventDefault();chug()},{passive:false});function chug(){if(state==='win'){location.href='boes-side-jobs-through-level5.html';return}let b=beers.find(b=>!b.done&&Math.abs(p.x-b.x)<78);if(!b){msg='GET TO A BEER';mt=45;return}b.n++;drinkFx=25;msg='CHUG '+b.n+'/5';mt=35;if(b.n>=5){b.done=1;cash+=75;msg='BEER FINISHED! +$75';mt=65;if(beers.every(x=>x.done)){state='win';cash+=perfect?250:100}}}function hit(){if(test||inv||state!=='play')return;hp--;perfect=0;inv=100;msg='SECURITY — MOVE!';mt=55;p.vx=p.x<cam+195?-5:5;if(hp<=0){hp=4;inv=180;p.x=Math.max(60,cam+80)}}function step(){tick++;if(mt)mt--;if(inv)inv--;if(drinkFx)drinkFx--;if(state!=='play')return;let acc=p.on?.46:.27,max=4.2;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.79:.94;let oy=p.y;p.x+=p.vx;p.vy+=.5;p.y+=p.vy;p.x=Math.max(25,Math.min(WORLD-55,p.x));p.on=0;if(p.vy>=0&&oy+PH<=G+6&&p.y+PH>=G){p.y=G-PH;p.vy=0;p.on=1}cam=Math.max(0,Math.min(WORLD-W,p.x-145));for(const a of guards){if(tick<a.wake)continue;let d=p.x-a.x;if(Math.abs(d)<640)a.x+=Math.sign(d)*1.32;if(Math.abs(p.x-a.x)<34&&p.on)hit()}}function neon(s,x,y,col){g.save();g.shadowBlur=10;g.shadowColor=col;T(s,sx(x),y,15,col,'center');g.restore()}function poster(x,y,w,h,title,sub,c1,c2){let q=sx(x);if(q+w<0||q>W)return;R(q-3,y-3,w+6,h+6,'#170d10');R(q,y,w,h,c1);R(q+4,y+4,w-8,h-8,c2);T(title,q+w/2,y+16,8,'#fff4c9','center');T(sub,q+w/2,y+h-8,6,'#f5d56d','center')}function dartboard(x,y){let q=sx(x);if(q<-45||q>435)return;g.save();g.translate(q,y);g.fillStyle='#151515';g.beginPath();g.arc(0,0,24,0,Math.PI*2);g.fill();g.fillStyle='#d6c89c';g.beginPath();g.arc(0,0,20,0,Math.PI*2);g.fill();g.fillStyle='#8e2e2e';g.beginPath();g.arc(0,0,14,0,Math.PI*2);g.fill();g.fillStyle='#1e4028';g.beginPath();g.arc(0,0,8,0,Math.PI*2);g.fill();g.fillStyle='#d7b13e';g.beginPath();g.arc(0,0,3,0,Math.PI*2);g.fill();g.strokeStyle='#111';for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(0,0);g.lineTo(20,0);g.stroke()}g.restore()}function wallDetails(){poster(520,205,78,92,'LIVE','FRI NITE','#6e2634','#31131c');poster(1120,225,70,82,'BEER','$2.50','#1d5063','#102b36');poster(1810,205,82,96,'POOL','TOURNEY','#315338','#17291d');poster(2320,220,76,86,'JUKE','5¢ SONGS','#64385b','#301c2b');poster(2740,200,84,98,'NO','FIGHTING','#713327','#381a15');dartboard(720,265);dartboard(2050,270);let flick=((tick>>4)%7)!==0;neon('OPEN',650,170,flick?'#ff456f':'#6b2436');neon('ICE COLD',1280,190,'#5bdcff');neon('NO COVER',2020,175,'#ff9d3d');neon('LAST CALL',2680,185,'#c987ff');for(let x=470;x<2900;x+=420){let q=sx(x);if(q>-25&&q<415){R(q,292,38,5,'#72513b');R(q+4,297,30,3,'#39261e')}}}function bg(){R(0,0,W,H,'#170f16');R(0,108,W,418,'#2a171b');for(let x=-cam%105;x<W;x+=105)R(x,120,2,372,'#442629');R(0,494,W,32,'#35231c');for(let x=-cam%50;x<W;x+=50)R(x,494,2,32,'#151010');neon('BOE’S LAST CALL',300,155,'#ff4f74');neon('COLD BEER',1050,175,'#65dfff');neon('POOL',1700,155,'#76ff87');neon('JUKEBOX',2500,180,'#ffb23d');wallDetails();for(let x=300;x<WORLD;x+=560){let q=sx(x);R(q,340,110,10,'#4b2b20');R(q+12,350,8,107,'#593720');R(q+90,350,8,107,'#593720');for(let i=0;i<4;i++){R(q+15+i*24,307,9,30,i%2?'#735c28':'#4b703a');R(q+17+i*24,300,5,8,'#d2c27c')}}let pool=sx(1500);R(pool,410,205,14,'#42291e');R(pool+10,365,185,45,'#28614c');R(pool+18,374,169,28,'#35775d');R(pool+22,424,10,68,'#3b271e');R(pool+172,424,10,68,'#3b271e');for(let i=0;i<9;i++){let q=sx(560+i*270);R(q,460,28,9,'#6b3c2b');R(q+9,469,10,24,'#493026')}}function backBar(){let q=sx(18);R(q,302,400,12,'#4d2b1d');R(q,354,400,10,'#4d2b1d');for(let i=0;i<15;i++){let bx=q+8+i*25;R(bx,316,8,35,i%3===0?'#5a7b45':i%3===1?'#8a6529':'#7c3340');R(bx+2,310,4,8,'#d2c27c')}R(q,365,400,20,'#2b1814')}function bartender(){let x=sx(185),y=G-104;R(x+13,y+82,9,22,'#252126');R(x+36,y+82,9,22,'#252126');R(x+9,y+43,40,43,'#17171b');R(x+16,y+10,27,29,'#d49b77');R(x+12,y+5,35,13,'#34231f');R(x+10,y+11,7,27,'#34231f');R(x+42,y+11,7,27,'#34231f');R(x+17,y+19,8,4,'#171717');R(x+34,y+19,8,4,'#171717');R(x+18,y+29,22,3,'#8d4a49');R(x+1,y+46,9,31,'#d49b77');R(x+49,y+45,9,31,'#d49b77');R(x+52,y+38,7,28,'#58703f');R(x+53,y+34,5,7,'#d8c67c');R(x-4,y+69,13,8,'#d9d4c6');T('BARTENDER',x+29,y-2,8,'#ffd98b','center')}function bar(){let q=sx(25);R(q,398,390,15,'#a66a38');R(q,413,390,79,'#47291b');R(q,413,390,4,'#9a5d32');R(q,394,390,5,'#d79b5f');for(let i=0;i<11;i++)R(q+15+i*32,363,9,31,i%2?'#735c28':'#4b703a');for(let i=0;i<8;i++){R(q+22+i*46,425,29,7,'#342018')}}function beer(b){let q=sx(b.x);if(q<-50||q>440)return;R(q-22,G-70,54,19,'#1a1012');T(b.done?'EMPTY':b.label,q+5,G-57,7,b.done?'#888':'#ffe27a','center');R(q,G-42,11,22,b.done?'#777':'#d6a633');R(q+2,G-39,7,15,b.done?'#aaa':'#f4cf54');R(q+11,G-37,4,9,'#a57d34');T(b.done?'✓':b.n+'/5',q+5,G-11,9,b.done?'#82ff91':'#fff','center')}function guy(x,sec=false){let q=sx(x),y=G-PH;R(q+9,y+44,10,16,'#202020');R(q+27,y+44,10,16,'#202020');R(q+8,y+30,11,16,'#303a48');R(q+26,y+30,11,16,'#303a48');R(q+5,y+13,35,21,sec?'#171b24':'#ded6c9');R(q+11,y,23,16,'#c98f6c');R(q+11,y+4,9,4,'#111');R(q+25,y+4,9,4,'#111');if(sec){T('SEC',q+23,y+28,8,'#f1d85b','center');R(q+2,y+14,4,27,'#d5b84c')}}function hud(){R(7,7,376,91,'#27151a');R(12,12,366,81,'#5b2a30');T('LEVEL 6: BOE’S LAST CALL',22,33,12,'#ffe079');T('BEERS '+beers.filter(b=>b.done).length+'/5 • 5 CHUGS EACH',22,53,9,'#fff');T(test?'DONNY ★ TEST MODE':'♥ '+hp,22,76,10,test?'#ffe15a':'#ff7b7b');T('$'+cash,360,76,10,'#8cff9a','right');if(mt)T(msg,195,116,9,'#ffe27a','center')}function draw(){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);bg();backBar();bartender();bar();beers.forEach(beer);guards.forEach(a=>{if(tick>=a.wake)guy(a.x,true)});guy(p.x);if(drinkFx)T('GLUG!',sx(p.x)+22,G-70,12,'#ffe27a','center');hud();if(state==='win'){R(35,185,320,225,'rgba(12,7,10,.94)');T('LAST CALL COMPLETE!',195,230,19,'#ffe36a','center');T(perfect?'BARROOM LEGEND':'MADE IT TO CLOSING',195,270,13,perfect?'#8cff95':'#fff','center');T('5 BEERS • 25 CHUGS',195,305,11,'#fff','center');T('TAP CHUG TO RETURN',195,380,10,'#ffe27a','center')}}function loop(now){let dt=Math.min(42,now-last);last=now;let steps=Math.max(1,Math.min(2,Math.round(dt/16.67)));for(let i=0;i<steps;i++)step();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
