<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs</title><style>html,body{margin:0;width:100%;height:100%;background:#15110d;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#15110d}</style></head><body><iframe id="game" src="boes-side-jobs-complete.html" allow="autoplay; fullscreen"></iframe><script>(()=>{const f=document.getElementById('game');function polish(){try{const w=f.contentWindow;if(!w||w.__boeHudPolished)return;const P=w.CanvasRenderingContext2D&&w.CanvasRenderingContext2D.prototype;if(!P)return;w.__boeHudPolished=1;const orig=P.fillText;P.fillText=function(text,x,y,maxWidth){let s=String(text),isHud=Number(y)<=120,isHeart=s.includes('♥')||s.includes('♡');if(!isHud)return maxWidth===undefined?orig.call(this,text,x,y):orig.call(this,text,x,y,maxWidth);this.save();if(isHeart){this.font='bold 20px monospace';this.shadowColor='rgba(0,0,0,.85)';this.shadowBlur=2;this.shadowOffsetX=1;this.shadowOffsetY=1;}const canvas=this.canvas,W=canvas&&canvas.width?canvas.width:390,pad=18,m=this.measureText(s).width,al=this.textAlign||'start';if(al==='right'||al==='end')x=Math.min(W-pad,Math.max(pad+m,x));else if(al==='center')x=Math.min(W-pad-m/2,Math.max(pad+m/2,x));else x=Math.min(W-pad-m,Math.max(pad,x));if(isHeart&&al==='right')x=Math.min(W-20,x);if(maxWidth===undefined)orig.call(this,text,x,y);else orig.call(this,text,x,y,Math.min(maxWidth,W-pad*2));this.restore()};}catch(e){}}f.addEventListener('load',()=>{polish();setTimeout(polish,80);setTimeout(polish,350)});setInterval(polish,1000)})();</script></body></html>
