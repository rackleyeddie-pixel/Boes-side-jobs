function playDraw(){bg();if(level<4){jobs.forEach(drawJob);osha.forEach(drawOSHA)}else{hideSpots.forEach(drawHideSpot);drawBoss()}for(const s of shots){let q=sx(s.x);R(q,s.y,13,2,'#d9d9d9');R(q+(s.vx>0?10:0),s.y-2,3,6,'#f4f4f4');R(q+(s.vx>0?0:11),s.y,2,2,'#888')}for(const t of tasers){R(sx(t.x),t.y,10,3,'#77d9ff');R(sx(t.x)+2,t.y-2,6,7,'#fff06a')}for(const z of parts)R(sx(z.x),z.y,3,3,z.type==='spark'?'#ffe76c':'#d3b48f');drawPlayer();hud()}
function shopScreen(){bg();wood(28,120,334,390);T('TOOL SHOP',195,165,25,'#21150c','center');T('$'+cash,195,194,15,'#245c21','center');wood(55,220,280,86);T('HAMMER — $300',195,254,15,'#21150c','center');T('FASTER REPAIRS',195,278,9,'#234d20','center');wood(55,330,280,103);T('NAIL GUN — ALL MONEY',195,364,14,'#21150c','center');T('RANGED OSHA STUN • OSHA GET TASERS',195,389,8,'#21150c','center');T('TAP A WOOD PANEL TO BUY',195,452,10,'#234d20','center');startBtn.classList.add('disabled');toolBtn.style.display='none'}
function win(){playDraw();R(35,230,320,180,'rgba(0,0,0,.82)');wood(61,245,268,135);T('LEVEL COMPLETE!',195,298,20,'#1e471a','center');T(level===3?'NEXT: HIDE FROM THE BOSS':'PRESS START',195,350,12,'#21150d','center');startBtn.classList.remove('disabled')}
function over(){playDraw();R(0,0,W,H,'rgba(0,0,0,.45)');wood(50,225,290,180);T('GAME OVER',195,279,30,'#a21f1f','center');T('RETURNING TO',195,355,11,'#20130b','center');T('CHARACTER SELECT...',195,378,12,'#20130b','center')}
function work(){if(state==='shop'||state!=='play')return;if(level===4){let s=hideSpots.find(s=>!s.used&&Math.abs((s.x+29)-(p.x+12))<75);if(hiddenSpot>=0){hiddenSpot=-1;hideTicks=0;msg='BACK OUT — FIND A NEW HIDING PLACE';mt=70;return}if(!s){msg='MOVE CLOSER TO AN UNUSED HIDING SPOT';mt=60;return}s.used=true;hideUsed.add(s.i);hiddenSpot=s.i;hideTicks=0;p.vx=0;msg='HIDDEN! WATCH THE 4-SECOND TIMER ABOVE THIS SPOT';mt=95;return}let j=jobs.find(j=>!j.done&&Math.abs((j.x+45)-(p.x+12))<88);if(!j){msg='MOVE CLOSER TO THE JOB';mt=45;return}j.prevN=j.n;j.n=Math.min(5,j.n+(tool==='hammer'&&level>=3?2:1));j.anim=30;workSwing=30;msg=j.type+' '+j.n+'/5';mt=45;for(let k=0;k<7;k++)particle(j.x+45,G-40,'spark');if(j.n>=5){j.done=1;cash+=75;msg='REPAIR COMPLETE! +$75';mt=70;if(jobs.every(z=>z.done)){state='win';startBtn.classList.remove('disabled')}}}
function nailFire(){if(state!=='play'||tool!=='nailgun'||level===4)return;shots.push({x:p.x+(p.dir>0?27:-3),y:p.y+21,vx:p.dir*7.2,life:46,hit:0});msg='NAIL FIRED!';mt=22}
function hit(t){if(inv||hiddenSpot>=0)return;hp--;inv=85;p.vy=-4.5;msg=t;mt=60;if(hp<=0){state='over';startBtn.classList.add('disabled');setTimeout(()=>{state='select';sel=0;level=1;cash=0;tool='';hp=4;startBtn.classList.remove('disabled')},1800)}}
function update(){tick++;if(mt)mt--;if(inv)inv--;if(workSwing)workSwing--;for(const j of jobs)if(j.anim)j.anim--;if(state!=='play')return;if(level===4&&boss){if(bossTicks>0)bossTicks--;if(bossTicks<=0){bossTicks=0;state='win';startBtn.classList.remove('disabled');msg='YOU OUTLASTED THE BOSS!';mt=100;return}boss.x+=boss.dir*boss.speed;const leftBound=cam+35,rightBound=cam+W-75;if(boss.x<=leftBound){boss.x=leftBound;boss.dir=1}if(boss.x>=rightBound){boss.x=rightBound;boss.dir=-1}}if(level===4&&hiddenSpot>=0){hideTicks++;if(hideTicks>=240){hiddenSpot=-1;hideTicks=0;msg='4 SECONDS ARE UP — MOVE TO A DIFFERENT HIDING SPOT!';mt=105}return}const acc=p.on?.52:.35,max=4.8;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.82:.97;if(jumpHold&&!p.on&&jumpFrames<12&&p.vy<0){p.vy-=.18;jumpFrames++}p.x+=p.vx;p.vy+=.57;p.y+=p.vy;if(p.y>=490){p.y=490;p.vy=0;p.on=1;jumpHold=0}p.x=Math.max(0,Math.min(WORLD-30,p.x));cam=Math.max(0,Math.min(WORLD-W,p.x-135));if(level===4&&boss){let overlap=Math.abs((p.x+12)-(boss.x+26))<34&&Math.abs((p.y+19)-(boss.y+40))<48;if(overlap)hit('THE BOSS CAUGHT YOU!');return}for(const a of osha){if(a.st){a.st--;continue}let d=p.x-a.x;if(Math.abs(d)<340)a.x+=Math.sign(d)*1.1;if(tool==='nailgun'&&level>=3){a.t=(a.t||100)-1;if(a.t<=0&&Math.abs(d)<360){tasers.push({x:a.x+14,y:494,vx:Math.sign(d)*3.8});a.t=95+Math.floor(Math.random()*80)}}if(Math.abs((p.x+12)-(a.x+14))<21&&Math.abs((p.y+20)-502)<28)hit('OSHA HIT!')}for(const s of shots){s.x+=s.vx;s.life--;for(const a of osha){if(!s.hit&&Math.abs((a.x+14)-s.x)<15&&Math.abs(494-s.y)<26){s.hit=1;a.st=150;for(let k=0;k<8;k++)particle(a.x,495,'spark');msg='NAIL HIT — OSHA STUNNED!';mt=45}}}shots=shots.filter(s=>!s.hit&&s.life>0&&s.x>cam-70&&s.x<cam+W+70);for(const t of tasers){t.x+=t.vx;if(Math.abs((p.x+12)-t.x)<14&&Math.abs((p.y+18)-t.y)<25){t.hit=1;hit('OSHA TASER HIT!')}}tasers=tasers.filter(t=>!t.hit&&t.x>cam-60&&t.x<cam+W+60);for(const z of parts){z.x+=z.vx;z.y+=z.vy;z.vy+=.08;z.l--}parts=parts.filter(z=>z.l>0)}
function render(){workBtn.textContent=(state==='play'&&level===4)?'HIDE':'WORK';g.clearRect(0,0,W,H);if(state==='select')selectScreen();else if(state==='shop')shopScreen();else if(state==='win')win();else if(state==='over')over();else playDraw()}
function loop(){update();render();requestAnimationFrame(loop)}
function stopBrowserGesture(e){e.preventDefault()}
['contextmenu','selectstart','dragstart','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,stopBrowserGesture,{passive:false}));document.addEventListener('touchmove',e=>{if(e.touches.length>0)e.preventDefault()},{passive:false});
function bindMove(el,dir){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);if(state==='select'){sel=(sel+(dir<0?-1:1)+3)%3;return}if(dir<0)left=1;else right=1},{passive:false});const off=e=>{e.preventDefault();if(dir<0)left=0;else right=0};['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off,{passive:false}))}
bindMove(leftBtn,-1);bindMove(rightBtn,1);jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play'&&p.on&&hiddenSpot<0){p.vy=-10.8-Math.min(Math.abs(p.vx)*.25,1.2);p.on=0;jumpHold=1;jumpFrames=0}},{passive:false});jumpBtn.addEventListener('pointerup',e=>{e.preventDefault();jumpHold=0},{passive:false});workBtn.addEventListener('pointerdown',e=>{e.preventDefault();work()},{passive:false});toolBtn.addEventListener('pointerdown',e=>{e.preventDefault();nailFire()},{passive:false});startBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(startBtn.classList.contains('disabled'))return;if(state==='select'){cash=0;tool='';level=1;setup();state='play'}else if(state==='win'){if(level===2){state='shop'}else if(level<4){level++;setup();state='play'}else{state='select';level=1;cash=0;tool=''}}},{passive:false});c.addEventListener('pointerdown',e=>{e.preventDefault();const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(state==='select'&&y>335&&y<475){if(x<130)sel=0;else if(x<255)sel=1;else sel=2}if(state==='shop'){if(y>=220&&y<=306&&cash>=300){cash-=300;tool='hammer';level=3;setup();state='play'}else if(y>=330&&y<=435){cash=0;tool='nailgun';level=3;setup();state='play'}}},{passive:false});
function syncViewport(){const h=Math.round(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--appH',h+'px')}
syncViewport();window.addEventListener('resize',syncViewport,{passive:true});if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewport,{passive:true});window.visualViewport.addEventListener('scroll',syncViewport,{passive:true})}loop();
})();
