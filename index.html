<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs — Play Now</title><meta name="description" content="Boe's Side Jobs — a retro pixel-art contractor arcade game with OSHA chases, tool upgrades, boss hiding, high-rise work and Last Call."><meta property="og:title" content="Boe's Side Jobs"><meta property="og:description" content="Play the latest Boe's Side Jobs build — retro contractor chaos, OSHA chases, tools, bosses and arcade-style side jobs."><meta property="og:type" content="website"><meta property="og:url" content="https://boes-side-jobs.vercel.app/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Boe's Side Jobs"><meta name="twitter:description" content="Retro contractor arcade chaos — play Boe's Side Jobs."><meta name="theme-color" content="#6e3e1d"><style>html,body{margin:0;width:100%;height:100%;background:#15110d;overflow:hidden;font-family:monospace}#game{display:block;width:100%;height:100%;border:0;background:#15110d}.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.banner{position:absolute;left:50%;top:11%;transform:translate(-50%,-18px) scale(.9);opacity:0;max-width:86vw;padding:10px 16px;border:4px solid #3a2112;background:linear-gradient(#b77a3f,#6b3c1e);box-shadow:0 5px 0 #1b0e07;color:#fff6be;text-shadow:2px 2px #30190d;font:900 18px/1.05 monospace;text-align:center;border-radius:6px;transition:.18s ease}.banner.on{opacity:1;transform:translate(-50%,0) scale(1)}.streak{position:absolute;right:10px;top:10px;opacity:0;padding:7px 10px;border:3px solid #402514;background:#8a572d;color:#fff5bc;font:900 12px monospace;box-shadow:0 4px 0 #1b0e07;transition:.18s ease}.streak.on{opacity:1}.pixel{position:absolute;width:7px;height:7px;animation:pop .9s linear forwards}@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}@media(prefers-reduced-motion:reduce){.banner,.streak{transition:none}.pixel{display:none}}</style></head><body><iframe id="game" src="boes-side-jobs-complete.html" allow="autoplay; fullscreen"></iframe><div class="fx" aria-hidden="true"><div id="banner" class="banner"></div><div id="streak" class="streak"></div><div id="confetti"></div></div><script>(()=>{const f=document.getElementById('game'),banner=document.getElementById('banner'),streakEl=document.getElementById('streak'),confetti=document.getElementById('confetti');let streak=0,hideTimer=0,lastEvent='',lastAt=0;const quips=['NAILED IT!','THAT’LL PASS INSPECTION. PROBABLY.','COFFEE MONEY!','SIDE JOB LEGEND!','MEASURE ONCE, SEND IT!','OSHA HATES THIS ONE TRICK','CLOCKED IN. LOCKED IN.','GOOD ENOUGH FOR FRIDAY!'];function showBanner(t,big=false){banner.textContent=t;banner.style.fontSize=big?'24px':'18px';banner.classList.add('on');clearTimeout(hideTimer);hideTimer=setTimeout(()=>banner.classList.remove('on'),big?1800:1050)}function bump(){streak++;streakEl.textContent='WORK STREAK x'+streak;streakEl.classList.add('on');setTimeout(()=>{if(streak>0)streakEl.classList.remove('on')},6500)}function resetStreak(){streak=0;streakEl.classList.remove('on')}function burst(n=24){const colors=['#ffe66d','#9cff90','#ffffff','#d7924b','#79d7ff'];for(let i=0;i<n;i++){let p=document.createElement('i');p.className='pixel';p.style.left=(45+Math.random()*10)+'%';p.style.top=(20+Math.random()*20)+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--x',((Math.random()-.5)*260)+'px');p.style.setProperty('--y',(80+Math.random()*250)+'px');confetti.appendChild(p);setTimeout(()=>p.remove(),1000)}}function event(s){const now=Date.now();if(s===lastEvent&&now-lastAt<650)return;lastEvent=s;lastAt=now;if(/REPAIR COMPLETE|JOB COMPLETE|LEVEL COMPLETE/i.test(s)){bump();showBanner(quips[Math.floor(Math.random()*quips.length)],/LEVEL COMPLETE|JOB COMPLETE/i.test(s));burst(/LEVEL COMPLETE|JOB COMPLETE/i.test(s)?50:24)}else if(/NAIL HIT|STUNNED/i.test(s)){bump();showBanner('OSHA’S MAD!');burst(14)}else if(/OSHA HIT|TASER HIT|GAME OVER|CAUGHT YOU/i.test(s)){resetStreak();showBanner('WALK IT OFF!')}else if(/1-UP|SECOND CHANCE/i.test(s)){showBanner('BONUS LIFE! KEEP SWINGING!',true);burst(60)}}function polish(){try{const w=f.contentWindow;if(!w||w.__boeFunPolished)return;const P=w.CanvasRenderingContext2D&&w.CanvasRenderingContext2D.prototype;if(!P)return;w.__boeFunPolished=1;const orig=P.fillText;P.fillText=function(text,x,y,maxWidth){let s=String(text),isHud=Number(y)<=120,isHeart=s.includes('♥')||s.includes('♡');if(isHud){this.save();if(isHeart){this.font='bold 20px monospace';this.shadowColor='rgba(0,0,0,.85)';this.shadowBlur=2;this.shadowOffsetX=1;this.shadowOffsetY=1}const canvas=this.canvas,W=canvas&&canvas.width?canvas.width:390,pad=18,m=this.measureText(s).width,al=this.textAlign||'start';if(al==='right'||al==='end')x=Math.min(W-pad,Math.max(pad+m,x));else if(al==='center')x=Math.min(W-pad-m/2,Math.max(pad+m/2,x));else x=Math.min(W-pad-m,Math.max(pad,x));if(isHeart&&al==='right')x=Math.min(W-20,x);if(maxWidth===undefined)orig.call(this,text,x,y);else orig.call(this,text,x,y,Math.min(maxWidth,W-pad*2));this.restore()}else{if(maxWidth===undefined)orig.call(this,text,x,y);else orig.call(this,text,x,y,maxWidth)}event(s)}}catch(e){}}f.addEventListener('load',()=>{polish();setTimeout(polish,80);setTimeout(polish,350)});setInterval(polish,900)})();</script></body></html>
