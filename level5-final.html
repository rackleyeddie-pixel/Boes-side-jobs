<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Boe's Side Jobs — Level 5</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#15110d;overflow:hidden;font-family:monospace;touch-action:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100svh;min-height:100svh;max-height:100svh}
#wrap{width:min(100vw,430px);height:calc(100svh - 132px);max-height:calc(100svh - 132px);min-height:0;padding:4px 6px 0;flex:0 0 auto}
canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:#111;border-radius:15px;display:block}
#ui{width:min(100vw,430px);height:132px;min-height:132px;flex:0 0 132px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 8px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#382519,#17100b);border-top:4px solid #79502d;box-shadow:inset 0 3px #c58b50}
.group{display:flex;gap:8px;align-items:center}.btn{border:3px solid #2e1d12;box-shadow:0 5px 0 #080604,inset 0 2px rgba(255,255,255,.2);background:linear-gradient(#c98a4e,#925525);color:#211307;font-weight:900;text-shadow:0 1px #efbd7d;display:flex;align-items:center;justify-content:center;touch-action:none}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #080604}.move{width:72px;height:70px;border-radius:14px;font-size:30px}.round{width:82px;height:82px;border-radius:50%;font-size:11px}.jump{background:linear-gradient(#ebc774,#b77a33)}.mason{background:linear-gradient(#d9aa61,#9c612d)}
@media(max-width:370px){.move{width:62px}.round{width:74px;height:74px}.group{gap:5px}#ui{padding-left:5px;padding-right:5px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="390" height="650"></canvas></div>
<div id="ui"><div class="group"><div id="left" class="btn move">◀</div><div id="right" class="btn move">▶</div></div><div class="group"><div id="work" class="btn round mason">MASON</div><div id="jump" class="btn round jump">JUMP<br>/ CLIMB</div></div></div>
<script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const W=390,H=650,params=new URLSearchParams(location.search),testMode=params.get('test')==='1';
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='bold '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};
let left=0,right=0,jumpHold=0,tick=0,hp=4,cash=900,msg='3 SECOND HEAD START — CLIMB!',mt=180,inv=180,camY=900,state='play',spawnGrace=180,ladderExitGrace=0,extraLife=params.get('life')==='1'?1:0,workFx=0;
const p={x:52,y:1410,vx:0,vy:0,on:1,dir:1};
const platforms=[1450,1240,1030,820,610,400,190];
const ladders=[{x:82,top:1240,bot:1450},{x:270,top:1030,bot:1240},{x:104,top:820,bot:1030},{x:268,top:610,bot:820},{x:94,top:400,bot:610},{x:266,top:190,bot:400}];
const jobs=[1240,1030,820,610,400,190].map((y,i)=>({x:i%2?258:205,y:y-72,n:0,done:0}));
const osha=[{x:315,y:1412,wake:180,pause:0},{x:302,y:1208,wake:300,pause:0},{x:48,y:998,wake:420,pause:0},{x:302,y:788,wake:540,pause:0}];
const sy=y=>y-camY;
function clearMove(){left=0;right=0} window.addEventListener('blur',clearMove);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMove()});
function bind(id,dir){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);dir<0?left=1:right=1},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();dir<0?left=0:right=0},{passive:false}))}
bind('left',-1);bind('right',1);
function nearLadder(){return ladders.some(L=>Math.abs((p.x+15)-L.x)<32&&p.y+38>L.top-20&&p.y<L.bot+20)}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpHold=1;if(p.on&&!nearLadder()){p.vy=-9.4;p.on=0;msg='JUMP!';mt=18}else if(nearLadder())ladderExitGrace=48},{passive:false});
document.getElementById('jump').addEventListener('pointerup',e=>{e.preventDefault();jumpHold=0},{passive:false});
document.getElementById('work').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='over'){if(extraLife){extraLife=0;reset(true)}else location.href='boes-side-jobs-through-level5.html';return}mason()},{passive:false});
function mason(){if(state!=='play')return;const j=jobs.find(j=>!j.done&&Math.abs((p.x+15)-(j.x+34))<82&&Math.abs((p.y+20)-(j.y+42))<74);if(!j){msg='MOVE CLOSER TO THE UNFINISHED WALL';mt=55;return}j.n=Math.min(5,j.n+1);workFx=24;msg='LAYING BRICK '+j.n+'/5';mt=38;if(j.n>=5){j.done=1;cash+=100;msg='WALL SECTION COMPLETE! +$100';mt=70;if(jobs.every(z=>z.done)){state='win';msg='MASONRY JOB COMPLETE!';mt=9999}}}
function hit(){if(testMode||inv||ladderExitGrace>0||state!=='play')return;hp--;inv=105;msg='OSHA HIT — BREAK FREE!';mt=70;p.vy=-2.5;p.vx=p.x<195?-5:5;p.x=Math.max(24,Math.min(300,p.x+(p.x<195?-52:52)));if(hp<=0){state='over';msg=extraLife?'1-UP READY — TAP MASON':'GAME OVER — TAP MASON TO RETURN';mt=9999}}
function reset(revive=false){hp=4;state='play';inv=180;spawnGrace=180;ladderExitGrace=0;tick=0;camY=900;Object.assign(p,{x:52,y:1410,vx:0,vy:0,on:1,dir:1});const s=[[315,1412],[302,1208],[48,998],[302,788]];osha.forEach((a,i)=>{a.x=s[i][0];a.y=s[i][1];a.wake=180+i*120;a.pause=0});jobs.forEach(j=>{j.n=0;j.done=0});msg=revive?'1-UP! 3 SECOND SAFE START':'3 SECOND HEAD START — CLIMB!';mt=180}
function update(){tick++;if(mt>0)mt--;if(inv>0)inv--;if(ladderExitGrace>0)ladderExitGrace--;if(workFx>0)workFx--;if(state!=='play')return;if(spawnGrace>0)spawnGrace--;const acc=p.on?.48:.28,max=4.15;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.78:.94;const L=ladders.find(L=>Math.abs((p.x+15)-L.x)<31&&p.y+38>L.top-20&&p.y<L.bot+20);if(L&&jumpHold){p.vy=-3.15;p.x+=(L.x-(p.x+15))*.18;p.on=0}else p.vy+=.52;const oldY=p.y;p.x+=p.vx;p.y+=p.vy;p.x=Math.max(22,Math.min(300,p.x));p.on=0;for(const py of platforms){if(p.vy>=0&&oldY+38<=py+5&&p.y+38>=py){p.y=py-38;p.vy=0;p.on=1;break}}if(p.y>1412){p.y=1412;p.vy=0;p.on=1}if(p.y<120)p.y=120;camY=Math.max(0,Math.min(1030,p.y-390));const awake=osha.filter(a=>tick>=a.wake),ranked=awake.slice().sort((a,b)=>(Math.abs(p.y-a.y)+Math.abs(p.x-a.x))-(Math.abs(p.y-b.y)+Math.abs(p.x-b.x))),hunters=new Set(ranked.slice(0,2));for(const a of osha){if(tick<a.wake)continue;if(a.pause){a.pause--;continue}const dy=p.y-a.y;if(hunters.has(a)){if(Math.abs(dy)>35){let best=ladders[0];for(const z of ladders)if(Math.abs(a.x-z.x)<Math.abs(a.x-best.x))best=z;if(Math.abs(a.x-best.x)>7)a.x+=Math.sign(best.x-a.x)*1.0;else{a.y+=Math.sign(dy)*1.05;if(Math.abs(a.y-best.top)<5||Math.abs(a.y-best.bot)<5)a.pause=22}}else a.x+=Math.sign(p.x-a.x)*1.16}else a.x+=Math.sin((tick+a.wake)*.025)*.24;a.x=Math.max(24,Math.min(304,a.x));a.y=Math.max(150,Math.min(1412,a.y));if(spawnGrace<=0&&Math.abs((p.x+15)-a.x)<23&&Math.abs((p.y+18)-a.y)<34)hit()}}
function drawGuy(x,y,oshaGuy=false,s=1.3){const step=(tick>>3)&1,leg=step?2:-2;R(x+(7+leg)*s,y+30*s,7*s,6*s,'#242424');R(x+(18-leg)*s,y+30*s,7*s,6*s,'#242424');R(x+(7+leg)*s,y+22*s,6*s,9*s,'#31465c');R(x+(18-leg)*s,y+22*s,6*s,9*s,'#31465c');R(x+6*s,y+10*s,19*s,14*s,oshaGuy?'#f0c43e':'#e9e3d8');R(x+3*s,y+13*s,5*s,10*s,'#d09a73');R(x+24*s,y+13*s,5*s,10*s,'#d09a73');R(x+9*s,y+1*s,12*s,10*s,'#d69d74');R(x+10*s,y+4*s,5*s,4*s,'#111');R(x+17*s,y+4*s,5*s,4*s,'#111');if(oshaGuy){R(x+7*s,y-4*s,18*s,5*s,'#e7e7e2');R(x+5*s,y,22*s,4*s,'#fff');R(x+22*s,y+2*s,8*s,3*s,'#fff');T('OSHA',x+16*s,y+29*s,7,'#fff','center')}else{R(x+7*s,y-3*s,16*s,5*s,'#7d1f23');R(x+5*s,y,20*s,5*s,'#b52d32');R(x+22*s,y+2*s,8*s,3*s,'#b52d32')}}
function wall(){R(150,112,240,H-112,'#b9a287');for(let y=124;y<H;y+=24){R(150,y,240,2,'#95816a');for(let x=150+((y/24)%2?18:0);x<390;x+=38)R(x,y,2,24,'#9c876f')}R(150,112,8,H-112,'#735f4d');for(let wy=230;wy<1450;wy+=210){const y=sy(wy);if(y>120&&y<625){R(304,y-72,62,54,'#36454e');R(310,y-66,23,45,'#76b8d0');R(338,y-66,19,45,'#6fa6b8');R(302,y-16,63,5,'#705c49')}}}
function drawJobs(){for(const j of jobs){const y=sy(j.y);if(y<100||y>625)continue;const x=j.x;R(x-5,y-3,9,9,'#8f7964');R(x+70,y-5,10,10,'#8f7964');R(x-4,y+48,10,10,'#8f7964');R(x+70,y+48,10,10,'#8f7964');R(x,y,76,57,'#544c43');for(let row=0;row<5;row++){if(row>=j.n)continue;for(let col=0;col<4;col++){const off=row%2?8:0,bx=x+off+col*18,by=y+45-row*10;R(bx,by,16,8,'#a85432');R(bx,by+7,16,2,'#d4a07e');if(col<3)R(bx+16,by,2,8,'#dbc9ad')}}if(j.n>0)R(x,y+54-j.n*10,74,2,'#dfcfb5');T(j.done?'WALL FINISHED':'LAY '+j.n+'/5',x+36,y-9,7,j.done?'#9cff90':'#fff','center');R(x-25,y+47,22,12,'#7c5a37');for(let b=0;b<3;b++)R(x-22+b*7,y+39,6,8,'#a85432')}}
function scaffold(){for(const py of platforms){const y=sy(py);if(y<100||y>650)continue;R(12,y-9,340,9,'#b88345');R(12,y,340,6,'#664527');R(18,y-45,5,45,'#56636a');R(347,y-45,5,45,'#56636a');R(18,y-45,334,4,'#56636a');R(18,y-27,334,3,'#6b7478');R(18,y-8,334,4,'#d8922f');for(let x=28;x<344;x+=78){R(x,y-185,5,185,'#737d82');R(x+60,y-185,5,185,'#737d82');g.strokeStyle='#69747a';g.lineWidth=3;g.beginPath();g.moveTo(x,y-180);g.lineTo(x+64,y-8);g.moveTo(x+64,y-180);g.lineTo(x,y-8);g.stroke()}}for(const L of ladders){const y1=sy(L.top),y2=sy(L.bot);if(y2<100||y1>650)continue;R(L.x-10,y1,4,y2-y1,'#d7a33d');R(L.x+10,y1,4,y2-y1,'#d7a33d');for(let y=y1+10;y<y2;y+=18)R(L.x-8,y,20,3,'#e0b553')}}
function supplies(){let y=sy(1368);if(y>110&&y<640){for(let i=0;i<6;i++){R(24+i*20,y-18,17,18,'#a85432');R(25+i*20,y-20,15,3,'#d39b78')}R(150,y-30,52,25,'#4f5d63');R(158,y-36,34,9,'#707e84');R(153,y-7,10,10,'#222');R(188,y-7,10,10,'#222');T('MIXER',176,y-14,6,'#fff','center');R(214,y-31,25,31,'#d7b73b');T('MORTAR',226,y-12,6,'#382d15','center')}}
function draw(){R(0,0,W,H,'#92b6d2');R(0,0,W,112,'#20262b');T("BOE'S SIDE JOBS",15,27,17,'#ffd85b');T('LEVEL 5: HIGH-RISE MASONRY',15,49,10);T('WALL SECTIONS '+jobs.filter(j=>j.done).length+'/6',15,70,11,'#9cff90');T(spawnGrace>0?'HEAD START '+Math.ceil(spawnGrace/60)+'s':'JUMP • HOLD AT LADDERS',15,91,8,spawnGrace>0?'#9cff90':'#ffe568');T('$'+cash,375,29,15,'#7bff6d','right');T(testMode?'DONNY TEST':'♥'.repeat(hp)+'♡'.repeat(4-hp),375,53,10,testMode?'#ffe568':'#ff6262','right');if(extraLife)T('1-UP x1',375,72,9,'#9cff90','right');wall();drawJobs();scaffold();supplies();for(const a of osha){const y=sy(a.y)-31;if(y>-70&&y<620){drawGuy(a.x,y,true);if(tick<a.wake)T('WAIT',a.x+20,y-9,7,'#ffe568','center')}}drawGuy(p.x,sy(p.y),false);if(workFx){let py=sy(p.y)+18,tx=p.dir>0?p.x+40:p.x-7;R(tx,py,18,3,'#b7b2a8');R(tx+(p.dir>0?13:-3),py-5,5,8,'#715239');for(let d=0;d<5;d++)R(tx+d*4,py+7+(d%2)*3,3,3,'#d8c7a9')}if(mt){R(24,116,342,35,'rgba(0,0,0,.76)');T(msg,195,139,8,'#fff','center')}if(state==='win'){R(42,228,306,190,'rgba(0,0,0,.82)');T('LEVEL COMPLETE!',195,286,22,'#9cff90','center');T('MASONRY FINISHED',195,326,12,'#ffe568','center')}if(state==='over'){R(42,228,306,190,'rgba(0,0,0,.82)');T('GAME OVER',195,286,24,'#ff6a5e','center');T(extraLife?'TAP MASON FOR 1-UP':'TAP MASON TO RETURN',195,340,10,'#fff','center')}}
function loop(){update();draw();requestAnimationFrame(loop)}
['contextmenu','selectstart','dragstart','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});loop();
})();
</script>
</body></html>
