<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Boe Character Detail Preview</title><style>html,body{margin:0;background:#17130f;color:#fff;font-family:monospace;height:100%;overflow:hidden;touch-action:none}body{display:flex;flex-direction:column;align-items:center}.top{padding:10px;font-weight:900}.wrap{width:min(100vw,430px);flex:1;display:flex;align-items:center;justify-content:center}.controls{width:min(100vw,430px);display:flex;justify-content:space-between;padding:10px;gap:8px}.btn{flex:1;min-height:58px;border:2px solid #332b24;border-radius:14px;font-weight:900;font-size:16px}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#8cccf0;border-radius:14px}</style></head><body><div class="top">BOE'S SIDE JOBS — CHARACTER DETAIL TEST</div><div class="wrap"><canvas id="c" width="390" height="620"></canvas></div><div class="controls"><button class="btn" id="prev">◀ CHARACTER</button><button class="btn" id="move">WALK</button><button class="btn" id="jump">JUMP</button><button class="btn" id="next">CHARACTER ▶</button></div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const names=['BOE','DONNY','JORDAN'];let sel=0,t=0,walking=false,jump=0;const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};const T=(s,x,y,z=14,col='#fff',a='left')=>{g.fillStyle=col;g.font='bold '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};function limb(x,y,l,w,ang,col){g.save();g.translate(x,y);g.rotate(ang);R(-w/2,0,w,l,col);g.restore()}function detailedGuy(cx,base,n,phase=0,air=0){const J=n==='JORDAN',D=n==='DONNY';const s=J?1.12:1;const skin=D?'#c98d65':J?'#d6a177':'#d8a276',hair=D?'#d8b638':J?'#2d211b':'#3a2a22',shirt=J?'#e4c93f':D?'#b74f38':'#e7e0d5',pants=D?'#3f4b58':'#385775',shoe=D?'#2a201a':'#252525';const dir=1;const walk=Math.sin(phase),arm=Math.sin(phase)*.6,leg=Math.sin(phase)*.7,bob=Math.abs(Math.sin(phase))*1.5;const y=base-bob-air;g.save();g.translate(cx,y);g.scale(s,s);const hipY=-37,shouldY=-68;limb(-8,hipY,23,8,leg*.45,pants);limb(8,hipY,23,8,-leg*.45,pants);limb(-8+Math.sin(leg*.45)*10,-16,14,7,-leg*.2,pants);limb(8-Math.sin(leg*.45)*10,-16,14,7,leg*.2,pants);R(-18,-5,18,7,shoe);R(2,-5,19,7,shoe);R(-17,-2,17,3,'#6c5b4c');R(4,-2,18,3,'#6c5b4c');R(-16,hipY-27,32,31,shirt);R(-13,hipY-24,26,4,'rgba(255,255,255,.18)');R(-16,hipY,32,4,'#273746');limb(-21,shouldY+7,27,7,-arm*.42,skin);limb(21,shouldY+7,27,7,arm*.42,skin);const lhx=-21+Math.sin(-arm*.42)*12,lhy=shouldY+31;const rhx=21+Math.sin(arm*.42)*12,rhy=shouldY+31;R(lhx-5,lhy,10,8,skin);R(rhx-5,rhy,10,8,skin);for(let i=0;i<3;i++){R(lhx-5+i*3,lhy+7,2,5,skin);R(rhx-5+i*3,rhy+7,2,5,skin)}R(-13,-91,26,25,skin);R(-14,-93,28,7,hair);R(-14,-89,5,10,hair);R(-7,-82,4,4,'#fff');R(4,-82,4,4,'#fff');R(-6,-81,2,2,'#2a251f');R(5,-81,2,2,'#2a251f');R(-1,-78,3,5,'#aa6f4d');R(-6,-70,13,2,'#7d4f3d');R(-11,-66,22,4,'#6e4a38');R(-13,-78,2,6,'#c58d68');R(12,-78,2,6,'#c58d68');if(D){R(18,-63,4,18,'#e0c632');R(21,-66,4,10,'#f2df55')}T(n,0,20,11,'#fff','center');g.restore()}function draw(){t+=walking?.12:.035;if(jump>0)jump--;g.clearRect(0,0,390,620);R(0,0,390,620,'#8cccf0');R(0,390,390,230,'#6f9c63');R(0,500,390,120,'#76573b');for(let i=0;i<4;i++){R(20+i*100,438,75,62,i%2?'#c98c63':'#d6a26f');R(28+i*100,424,59,18,'#5b3725')}T('DETAILED CHARACTER PASS',195,52,19,'#2c1a12','center');T('Eyes • nose • hair • fingers • shoes • human walk',195,78,9,'#2c1a12','center');detailedGuy(195,490,names[sel],t,jump?Math.sin((30-jump)/30*Math.PI)*55:0);requestAnimationFrame(draw)}document.getElementById('prev').onclick=()=>sel=(sel+2)%3;document.getElementById('next').onclick=()=>sel=(sel+1)%3;document.getElementById('move').onclick=()=>{walking=!walking;document.getElementById('move').textContent=walking?'STOP':'WALK'};document.getElementById('jump').onclick=()=>{if(!jump)jump=30};draw()})();</script></body></html>
