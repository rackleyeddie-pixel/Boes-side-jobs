<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#15110d;color:#fff;font-family:monospace;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.app{width:min(100vw,430px);height:100svh;background:linear-gradient(#8fc4df 0 28%,#7fb567 28% 46%,#6f9b55 46% 58%,#6c4528 58%);position:relative;overflow:hidden}.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92}.wood{background:linear-gradient(#bb7a3d,#875027);border:4px solid #4b2b17;box-shadow:inset 0 3px #ddb17a,0 5px 0 #2b180d;border-radius:12px}.title{position:absolute;top:34px;left:30px;right:30px;padding:14px 8px;text-align:center;font-weight:900;font-size:25px;color:#27160c;text-shadow:0 2px #e0b27b}.sub{font-size:11px;margin-top:5px}.panel{position:absolute;left:28px;right:28px;top:145px;bottom:34px;padding:16px}.charrow{display:flex;gap:10px;justify-content:center}.char{width:30%;min-height:116px;padding:8px 4px;text-align:center;border:3px solid #4b2b17;border-radius:12px;background:#b8793c;color:#21130b;font-weight:900}.char.sel{outline:5px solid #ffe15a;transform:translateY(-3px)}.face{width:44px;height:54px;margin:0 auto 7px;position:relative}.head{position:absolute;left:12px;top:5px;width:20px;height:19px;background:#d29a72}.hat{position:absolute;left:8px;top:0;width:28px;height:8px;background:#a72d31}.body{position:absolute;left:8px;top:23px;width:28px;height:26px;background:#e4ddd1}.leg{position:absolute;top:47px;width:8px;height:7px;background:#273545}.l1{left:9px}.l2{left:26px}.controls{text-align:center;margin:13px 0 8px;font-weight:900;color:#2a170c}.levels{display:none}.levels.show{display:block}.levelgrid{display:grid;grid-template-columns:1fr;gap:7px;max-height:360px;overflow:auto;padding:3px}.lvl{padding:10px 8px;border-radius:9px;background:linear-gradient(#c98a4f,#965c2e);border:3px solid #4c2b18;color:#21140d;font-weight:900;text-align:center}.lvl.sel{outline:4px solid #ffe15a;background:linear-gradient(#dd9c51,#ad6b33)}.note{text-align:center;font-size:9px;margin-top:9px;color:#3b2214}.btnrow{display:flex;gap:10px;margin-top:12px}.btn{flex:1;padding:13px 8px;border-radius:12px;border:3px solid #321c0f;background:linear-gradient(#c58a4d,#8c542b);font-weight:900;color:#211307;box-shadow:0 4px 0 #2b170c}.hidden{display:none}</style></head><body><div class="app"><div class="cloud" style="width:76px;height:26px;top:104px;left:17px"></div><div class="cloud" style="width:98px;height:30px;top:78px;right:16px"></div><div class="title wood">BOE'S SIDE JOBS<div class="sub">TEST BUILD • LEVELS 1–6</div></div><div class="panel wood"><div id="chars"><div class="controls">CHOOSE CHARACTER</div><div class="charrow"><div class="char sel" data-i="0"><div class="face"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div></div>BOE</div><div class="char" data-i="1"><div class="face"><div class="hat" style="background:#d1b62e"></div><div class="head"></div><div class="body" style="background:#e1c83d"></div><div class="leg l1"></div><div class="leg l2"></div></div>DONNY</div><div class="char" data-i="2"><div class="face"><div class="hat" style="background:#315a89"></div><div class="head"></div><div class="body" style="background:#bdc9d5"></div><div class="leg l1"></div><div class="leg l2"></div></div>JORDAN</div></div><div class="btnrow"><button class="btn" id="prevChar">◀</button><button class="btn" id="choose">CHOOSE</button><button class="btn" id="nextChar">▶</button></div></div><div id="levels" class="levels"><div class="controls">SELECT LEVEL</div><div class="levelgrid" id="levelgrid"></div><div class="btnrow"><button class="btn" id="back">BACK</button><button class="btn" id="play">PLAY</button></div><div class="note">LEVEL 6 GOES STRAIGHT TO BOE'S LAST CALL. LEVELS 1–5 OPEN THE CURRENT PLAYABLE BUILD.</div></div></div></div><script>(()=>{const names=['BOE','DONNY','JORDAN'];const labels=['LEVEL 1 — FENCE JOB','LEVEL 2 — AUTO REPAIR','LEVEL 3 — BACKYARD DECK','LEVEL 4 — HIDE FROM BOSS','LEVEL 5 — FACADE RESTORATION','LEVEL 6 — BOE\'S LAST CALL'];let ci=0,li=0;const chars=[...document.querySelectorAll('.char')],grid=document.getElementById('levelgrid');labels.forEach((s,i)=>{const d=document.createElement('div');d.className='lvl'+(i===0?' sel':'');d.textContent=s;d.onclick=()=>{li=i;renderLevels()};grid.appendChild(d)});function renderChars(){chars.forEach((e,i)=>e.classList.toggle('sel',i===ci))}function renderLevels(){[...grid.children].forEach((e,i)=>e.classList.toggle('sel',i===li))}prevChar.onclick=()=>{ci=(ci+2)%3;renderChars()};nextChar.onclick=()=>{ci=(ci+1)%3;renderChars()};chars.forEach((e,i)=>e.onclick=()=>{ci=i;renderChars()});choose.onclick=()=>{chars.parentElement.parentElement.classList.add('hidden');levels.classList.add('show')};back.onclick=()=>{levels.classList.remove('show');chars.parentElement.parentElement.classList.remove('hidden')};play.onclick=()=>{const n=names[ci];if(li===5){location.href='level6-divebar.html'+(n==='DONNY'?'?test=1':'')}else{location.href='boes-side-jobs-through-level5.html'}};})();</script></body></html>
