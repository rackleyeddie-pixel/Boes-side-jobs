<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Boe Ball</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:#17120d;color:white;font-family:monospace;text-align:center}.w{max-width:850px;margin:auto}.hud{padding:10px;font-weight:bold}.g{position:relative;aspect-ratio:16/9;background:linear-gradient(#72c7ef 0 60%,#bd7d45 60%);overflow:hidden;border:4px solid #56371e}.court{position:absolute;left:2%;right:2%;bottom:5%;height:32%;border:3px solid white}.mid{position:absolute;left:50%;height:100%;border-left:3px solid white}.rim{position:absolute;right:6%;bottom:38%;width:42px;border-top:6px solid #d43}.post{position:absolute;right:6%;bottom:8%;height:32%;border-left:7px solid #ddd}.p,.o{position:absolute;bottom:20%;width:30px;height:48px;border:3px solid #222;background:#f2c85b}.p:before,.o:before{content:'';position:absolute;left:3px;top:-21px;width:19px;height:19px;border-radius:50%;background:#deb07e;border:2px solid #222}.o{background:#eee}.o:after{content:'OSHA';color:#111;font-size:8px;position:absolute;left:2px;top:15px}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#e87925;border:2px solid #522}.msg{position:absolute;top:8%;left:0;right:0;font-weight:bold;font-size:20px;text-shadow:2px 2px #000}.c{display:flex;justify-content:space-between;padding:8px;gap:8px}.grp{display:flex;gap:8px}.b{min-width:70px;min-height:58px;border:3px solid #56371e;border-radius:12px;background:#b97636;color:white;font:bold 15px monospace}.s{background:#963c32}.j{background:#3d6997}</style><div class="w"><div class="hud">BOE BALL &nbsp; BOE <b id="sc">0</b> - 0 OSHA</div><div class="g" id="g"><div class="court"><div class="mid"></div></div><div class="post"></div><div class="rim"></div><div class="p" id="p"></div><div class="o" id="o"></div><div class="ball" id="ball"></div><div class="msg" id="m">2D QUESTIONABLE STREET BASKETBALL</div></div><div class="c"><div class="grp"><button class="b" data-k="l">◀</button><button class="b" data-k="r">▶</button></div><div class="grp"><button class="b j" data-k="j">JUMP</button><button class="b s" data-k="s">SHOOT</button></div></div><small>Hold SHOOT for power, release to fire.</small></div><script>(()=>{let g=document.querySelector('#g'),p=document.querySelector('#p'),o=document.querySelector('#o'),b=document.querySelector('#ball'),m=document.querySelector('#m'),sc=document.querySelector('#sc'),x=140,y=0,vy=0,bx=160,by=100,bvx=0,bvy=0,held=1,k={},pow=0,score=0,last=performance.now();function down(q,v){k[q]=v;if(q==='j'&&v&&y==0)vy=450;if(q==='s'&&!v&&held){held=0;bvx=350+pow*4;bvy=330+pow*3;pow=0}}document.querySelectorAll('[data-k]').forEach(e=>{let q=e.dataset.k;e.onpointerdown=a=>{a.preventDefault();e.setPointerCapture(a.pointerId);down(q,1)};e.onpointerup=a=>{a.preventDefault();down(q,0)}});function loop(n){let d=Math.min(.03,(n-last)/1000);last=n,W=g.clientWidth,H=g.clientHeight,ground=H*.2;x+=((k.r?1:0)-(k.l?1:0))*240*d;x=Math.max(5,Math.min(W-35,x));vy-=900*d;y+=vy*d;if(y<0)y=vy=0;if(k.s&&held)pow=Math.min(60,pow+d*45);let ox=W*.72+Math.sin(n/500)*35;o.style.left=ox+'px';if(held){bx=x+22;by=ground+y+32}else{bvy-=760*d;bx+=bvx*d;by+=bvy*d;if(by<ground){by=ground;bvy=Math.abs(bvy)*.55;bvx*=.82}let rx=W*.94;if(bx>rx-18&&bx<rx+20&&by>H*.50&&by<H*.68&&bvy<0){score+=x<W*.63?3:2;sc.textContent=score;m.textContent=score%3==0?'BOE FOR THREE!':'BUCKET!';held=1;x=W*.25;setTimeout(()=>m.textContent='',700)}if(bx>W+30||bx<0){held=1;m.textContent='OUT OF BOUNDS';setTimeout(()=>m.textContent='',600)}}p.style.left=x+'px';p.style.bottom=(ground+y)+'px';b.style.left=(bx-9)+'px';b.style.bottom=(by-9)+'px';requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script>
