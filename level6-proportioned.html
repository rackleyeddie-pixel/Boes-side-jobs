<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs — Level 6</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b10;font-family:monospace;touch-action:none}body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;height:100svh}#wrap{width:min(100vw,430px);height:calc(100svh - 132px);padding:4px 6px 0}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#120c12;border-radius:15px;display:block}#ui{width:min(100vw,430px);height:132px;flex:0 0 132px;display:flex;justify-content:space-between;gap:8px;padding:9px 8px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#321722,#12090d);border-top:4px solid #7c3b42}.group{display:flex;gap:8px}.btn{border:3px solid #241017;box-shadow:0 5px 0 #050304,inset 0 2px #ffffff33;background:linear-gradient(#a14b51,#642633);color:#fff1cf;font-weight:900;text-shadow:0 2px #321017;display:flex;align-items:center;justify-content:center;touch-action:none}.move{width:70px;height:72px;border-radius:14px;font-size:29px}.round{width:82px;height:82px;border-radius:50%;font-size:12px}.jump{background:linear-gradient(#c89249,#7b4725)}.drink{background:linear-gradient(#d2a33c,#8d5d19);color:#271504}</style></head><body><div id="wrap"><canvas id="game" width="390" height="650"></canvas></div><div id="ui"><div class="group"><div id="left" class="btn move">◀</div><div id="right" class="btn move">▶</div></div><div class="group"><div id="drink" class="btn round drink">CHUG</div><div id="jump" class="btn round jump">JUMP</div></div></div><script>(()=>{const c=game,g=c.getContext('2d'),W=390,H=650,G=526,WORLD=2600,test=new URLSearchParams(location.search).get('test')==='1';g.imageSmoothingEnabled=false;const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='900 '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};let left=0,right=0,tick=0,cam=0,hp=4,cash=1200,state='play',msg='LAST CALL — FINISH THE BEERS!',mt=180,inv=120,drinkFx=0,perfect=1;const p={x:90,y:G-70,vx:0,vy:0,on:1,dir:1};const beers=[360,800,1240,1680,2120].map((x,i)=>({x,n:0,done:0,label:['COLD ONE','HOUSE CAN','TALL BOY','BAR SPECIAL','LAST CALL'][i]}));const guards=[{x:700,wake:210},{x:1450,wake:390},{x:2250,wake:570}],sx=x=>x-cam;function bind(id,d){let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();d<0?left=1:right=1};['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,q=>{d<0?left=0:right=0}))}bind('left',-1);bind('right',1);jump.onpointerdown=e=>{e.preventDefault();if(p.on){p.vy=-10;p.on=0}};drink.onpointerdown=e=>{e.preventDefault();chug()};function chug(){if(state==='win'){location.href='boes-side-jobs-through-level5.html';return}let b=beers.find(b=>!b.done&&Math.abs(p.x-b.x)<72);if(!b){msg='GET TO A BEER';mt=45;return}b.n++;drinkFx=25;msg='CHUG '+b.n+'/5';mt=35;if(b.n>=5){b.done=1;cash+=75;msg='BEER FINISHED! +$75';mt=65;if(beers.every(x=>x.done)){state='win';cash+=perfect?250:100}}}function hit(){if(test||inv||state!=='play')return;hp--;perfect=0;inv=100;msg='SECURITY — MOVE!';mt=55;p.vx=p.x<cam+195?-5:5;if(hp<=0){hp=4;inv=180;p.x=Math.max(60,cam+80)}}function update(){tick++;if(mt)mt--;if(inv)inv--;if(drinkFx)drinkFx--;if(state!=='play')return;let acc=p.on?.48:.28,max=4.4;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.78:.94;let oy=p.y;p.x+=p.vx;p.vy+=.52;p.y+=p.vy;p.x=Math.max(25,Math.min(WORLD-55,p.x));p.on=0;if(p.vy>=0&&oy+70<=G+6&&p.y+70>=G){p.y=G-70;p.vy=0;p.on=1}cam=Math.max(0,Math.min(WORLD-W,p.x-145));for(const a of guards){if(tick<a.wake)continue;let d=p.x-a.x;if(Math.abs(d)<600)a.x+=Math.sign(d)*1.4;if(Math.abs(p.x-a.x)<38&&p.on)hit()}}function neon(s,x,y,col){g.save();g.shadowBlur=12;g.shadowColor=col;T(s,sx(x),y,16,col,'center');g.restore()}function bg(){R(0,0,W,H,'#170f16');R(0,108,W,418,'#2a171b');for(let x=-cam%105;x<W;x+=105){R(x,120,2,372,'#442629')}R(0,494,W,32,'#35231c');for(let x=-cam%50;x<W;x+=50)R(x,494,2,32,'#151010');neon('BOE’S LAST CALL',260,155,'#ff4f74');neon('COLD BEER',900,175,'#65dfff');neon('POOL',1500,155,'#76ff87');neon('JUKEBOX',2200,180,'#ffb23d');for(let x=280;x<WORLD;x+=520){let q=sx(x);R(q,325,120,12,'#4b2b20');R(q+12,337,8,120,'#593720');R(q+100,337,8,120,'#593720');for(let i=0;i<4;i++){R(q+18+i*25,288,10,34,i%2?'#735c28':'#4b703a');R(q+20+i*25,281,6,9,'#d2c27c')}}let pool=sx(1320);R(pool,404,220,16,'#42291e');R(pool+10,354,200,50,'#28614c');R(pool+20,364,180,30,'#35775d');R(pool+22,420,11,72,'#3b271e');R(pool+187,420,11,72,'#3b271e');for(let i=0;i<8;i++){let q=sx(520+i*260);R(q,455,32,10,'#6b3c2b');R(q+11,465,10,29,'#493026')}}function bar(){let q=sx(40);R(q,385,340,18,'#6b3b21');R(q,403,340,89,'#47291b');R(q,403,340,5,'#9a5d32');for(let i=0;i<10;i++)R(q+15+i*31,348,10,34,i%2?'#735c28':'#4b703a')}function bartender(){let x=sx(165),y=G-76;R(x+8,y+55,10,21,'#222');R(x+31,y+55,10,21,'#222');R(x+6,y+28,38,31,'#6d2339');R(x+12,y,27,29,'#d49b77');R(x+9,y-5,33,9,'#4b271b');R(x,y+25,8,35,'#d49b77');R(x+44,y+25,8,35,'#d49b77');T('BARTENDER',x+25,y-12,8,'#ffd98b','center')}function beer(b){let q=sx(b.x);if(q<-50||q>440)return;R(q-24,G-82,60,22,'#1a1012');T(b.done?'EMPTY':b.label,q+6,G-67,7,b.done?'#888':'#ffe27a','center');R(q,G-53,14,29,b.done?'#777':'#d6a633');R(q+3,G-49,8,20,b.done?'#aaa':'#f4cf54');R(q+14,G-47,5,12,'#a57d34');T(b.done?'✓':b.n+'/5',q+7,G-14,9,b.done?'#82ff91':'#fff','center')}function guy(x,sec=false){let q=sx(x),y=G-70;R(q+10,y+52,11,18,'#202020');R(q+31,y+52,11,18,'#202020');R(q+9,y+34,12,20,'#303a48');R(q+30,y+34,12,20,'#303a48');R(q+6,y+15,40,24,sec?'#171b24':'#ded6c9');R(q+13,y,26,18,'#c98f6c');R(q+13,y+5,10,5,'#111');R(q+29,y+5,10,5,'#111');if(sec){T('SEC',q+26,y+31,8,'#f1d85b','center');R(q+3,y+15,4,30,'#d5b84c')}}function hud(){R(7,7,376,91,'#27151a');R(12,12,366,81,'#5b2a30');T('LEVEL 6: BOE’S LAST CALL',22,33,12,'#ffe079');T('BEERS '+beers.filter(b=>b.done).length+'/5 • 5 CHUGS EACH',22,53,9,'#fff');T(test?'DONNY ★ TEST MODE':'♥ '+hp,22,76,10,test?'#ffe15a':'#ff7b7b');T('$'+cash,360,76,10,'#8cff9a','right');if(mt)T(msg,195,116,9,'#ffe27a','center')}function draw(){bg();bar();bartender();beers.forEach(beer);guards.forEach(a=>{if(tick>=a.wake)guy(a.x,true)});guy(p.x);if(drinkFx)T('GLUG!',sx(p.x)+25,G-82,12,'#ffe27a','center');hud();if(state==='win'){R(35,185,320,225,'rgba(12,7,10,.94)');T('LAST CALL COMPLETE!',195,230,19,'#ffe36a','center');T(perfect?'BARROOM LEGEND':'MADE IT TO CLOSING',195,270,13,perfect?'#8cff95':'#fff','center');T('5 BEERS • 25 CHUGS',195,305,11,'#fff','center');T('TAP CHUG TO RETURN',195,380,10,'#ffe27a','center')}}function loop(){update();draw();requestAnimationFrame(loop)}loop()})();</script></body></html>
