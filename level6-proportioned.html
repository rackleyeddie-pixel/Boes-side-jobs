<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs — Level 6</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b10;font-family:monospace;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;height:100dvh;min-height:100dvh}#wrap{width:min(100vw,430px);height:calc(100dvh - 132px);flex:1 1 auto;min-height:0;padding:4px 6px 0;overflow:hidden;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;max-width:430px;object-fit:contain;image-rendering:pixelated;background:#120c12;border-radius:15px;touch-action:none}#ui{width:min(100vw,430px);height:132px;min-height:132px;flex:0 0 132px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 8px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#321722,#12090d);border-top:4px solid #7c3b42;touch-action:none}.group{display:flex;gap:8px}.btn{border:3px solid #241017;box-shadow:0 5px 0 #050304,inset 0 2px #ffffff33;background:linear-gradient(#a14b51,#642633);color:#fff1cf;font-weight:900;text-shadow:0 2px #321017;display:flex;align-items:center;justify-content:center;touch-action:none}.move{width:70px;height:72px;border-radius:14px;font-size:29px}.round{width:82px;height:82px;border-radius:50%;font-size:12px}.jump{background:linear-gradient(#c89249,#7b4725)}.drink{background:linear-gradient(#d2a33c,#8d5d19);color:#271504}@media(max-width:370px){.move{width:62px}.round{width:74px;height:78px}.group{gap:5px}}</style></head><body><div id="wrap"><canvas id="game" width="390" height="650"></canvas></div><div id="ui"><div class="group"><div id="left" class="btn move">◀</div><div id="right" class="btn move">▶</div></div><div class="group"><div id="drink" class="btn round drink">CHUG</div><div id="jump" class="btn round jump">JUMP</div></div></div><script>(()=>{document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});const c=document.getElementById('game'),g=c.getContext('2d'),W=390,H=650,G=526,WORLD=3000,test=new URLSearchParams(location.search).get('test')==='1';g.imageSmoothingEnabled=false;const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='900 '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};let left=0,right=0,tick=0,cam=0,hp=4,cash=1200,state='play',msg='LAST CALL — FINISH THE BEERS!',mt=180,inv=120,drinkFx=0,perfect=1,last=performance.now();const PH=60;const p={x:90,y:G-PH,vx:0,vy:0,on:1,dir:1};const beers=[420,920,1420,1920,2420].map((x,i)=>({x,n:0,done:0,label:['COLD ONE','HOUSE CAN','TALL BOY','BAR SPECIAL','LAST CALL'][i]}));const guards=[{x:760,wake:240},{x:1550,wake:450},{x:2550,wake:660}],sx=x=>x-cam;function clearMove(){left=right=0}window.addEventListener('blur',clearMove);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMove()});function bind(id,d){const e=document.getElementById(id);e.addEventListener('pointerdown',q=>{q.preventDefault();try{e.setPointerCapture(q.pointerId)}catch(_){};d<0?left=1:right=1},{passive:false});const up=q=>{q.preventDefault();d<0?left=0:right=0};e.addEventListener('pointerup',up,{passive:false});e.addEventListener('pointercancel',up,{passive:false});e.addEventListener('lostpointercapture',()=>{d<0?left=0:right=0})}bind('left',-1);bind('right',1);document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(p.on){p.vy=-9.5;p.on=0}},{passive:false});document.getElementById('drink').addEventListener('pointerdown',e=>{e.preventDefault();chug()},{passive:false});function chug(){if(state==='win'){location.href='boes-side-jobs-through-level5.html';return}let b=beers.find(b=>!b.done&&Math.abs(p.x-b.x)<78);if(!b){msg='GET TO A BEER';mt=45;return}b.n++;drinkFx=25;msg='CHUG '+b.n+'/5';mt=35;if(b.n>=5){b.done=1;cash+=75;msg='BEER FINISHED! +$75';mt=65;if(beers.every(x=>x.done)){state='win';cash+=perfect?250:100}}}function hit(){if(test||inv||state!=='play')return;hp--;perfect=0;inv=100;msg='SECURITY — MOVE!';mt=55;p.vx=p.x<cam+195?-5:5;if(hp<=0){hp=4;inv=180;p.x=Math.max(60,cam+80)}}function step(){tick++;if(mt)mt--;if(inv)inv--;if(drinkFx)drinkFx--;if(state!=='play')return;let acc=p.on?.46:.27,max=4.2;if(left){p.vx=Math.max(-max,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(max,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.79:.94;let oy=p.y;p.x+=p.vx;p.vy+=.5;p.y+=p.vy;p.x=Math.max(25,Math.min(WORLD-55,p.x));p.on=0;if(p.vy>=0&&oy+PH<=G+6&&p.y+PH>=G){p.y=G-PH;p.vy=0;p.on=1}cam=Math.max(0,Math.min(WORLD-W,p.x-145));for(const a of guards){if(tick<a.wake)continue;let d=p.x-a.x;if(Math.abs(d)<640)a.x+=Math.sign(d)*1.32;if(Math.abs(p.x-a.x)<34&&p.on)hit()}}function neon(s,x,y,col){g.save();g.shadowBlur=10;g.shadowColor=col;T(s,sx(x),y,15,col,'center');g.restore()}function bg(){R(0,0,W,H,'#170f16');R(0,108,W,418,'#2a171b');for(let x=-cam%105;x<W;x+=105)R(x,120,2,372,'#442629');R(0,494,W,32,'#35231c');for(let x=-cam%50;x<W;x+=50)R(x,494,2,32,'#151010');neon('BOE’S LAST CALL',300,155,'#ff4f74');neon('COLD BEER',1050,175,'#65dfff');neon('POOL',1700,155,'#76ff87');neon('JUKEBOX',2500,180,'#ffb23d');for(let x=300;x<WORLD;x+=560){let q=sx(x);R(q,340,110,10,'#4b2b20');R(q+12,350,8,107,'#593720');R(q+90,350,8,107,'#593720');for(let i=0;i<4;i++){R(q+15+i*24,307,9,30,i%2?'#735c28':'#4b703a');R(q+17+i*24,300,5,8,'#d2c27c')}}let pool=sx(1500);R(pool,410,205,14,'#42291e');R(pool+10,365,185,45,'#28614c');R(pool+18,374,169,28,'#35775d');R(pool+22,424,10,68,'#3b271e');R(pool+172,424,10,68,'#3b271e');for(let i=0;i<9;i++){let q=sx(560+i*270);R(q,460,28,9,'#6b3c2b');R(q+9,469,10,24,'#493026')}}function bar(){let q=sx(25);R(q,398,390,15,'#6b3b21');R(q,413,390,79,'#47291b');R(q,413,390,4,'#9a5d32');for(let i=0;i<11;i++)R(q+15+i*32,363,9,31,i%2?'#735c28':'#4b703a')}function bartender(){let x=sx(180),y=G-62;R(x+8,y+44,9,18,'#222');R(x+29,y+44,9,18,'#222');R(x+6,y+24,34,24,'#6d2339');R(x+11,y,24,25,'#d49b77');R(x+9,y-5,29,8,'#4b271b');R(x,y+20,7,29,'#d49b77');R(x+40,y+20,7,29,'#d49b77');T('BARTENDER',x+23,y-11,8,'#ffd98b','center')}function beer(b){let q=sx(b.x);if(q<-50||q>440)return;R(q-22,G-70,54,19,'#1a1012');T(b.done?'EMPTY':b.label,q+5,G-57,7,b.done?'#888':'#ffe27a','center');R(q,G-42,11,22,b.done?'#777':'#d6a633');R(q+2,G-39,7,15,b.done?'#aaa':'#f4cf54');R(q+11,G-37,4,9,'#a57d34');T(b.done?'✓':b.n+'/5',q+5,G-11,9,b.done?'#82ff91':'#fff','center')}function guy(x,sec=false){let q=sx(x),y=G-PH;R(q+9,y+44,10,16,'#202020');R(q+27,y+44,10,16,'#202020');R(q+8,y+30,11,16,'#303a48');R(q+26,y+30,11,16,'#303a48');R(q+5,y+13,35,21,sec?'#171b24':'#ded6c9');R(q+11,y,23,16,'#c98f6c');R(q+11,y+4,9,4,'#111');R(q+25,y+4,9,4,'#111');if(sec){T('SEC',q+23,y+28,8,'#f1d85b','center');R(q+2,y+14,4,27,'#d5b84c')}}function hud(){R(7,7,376,91,'#27151a');R(12,12,366,81,'#5b2a30');T('LEVEL 6: BOE’S LAST CALL',22,33,12,'#ffe079');T('BEERS '+beers.filter(b=>b.done).length+'/5 • 5 CHUGS EACH',22,53,9,'#fff');T(test?'DONNY ★ TEST MODE':'♥ '+hp,22,76,10,test?'#ffe15a':'#ff7b7b');T('$'+cash,360,76,10,'#8cff9a','right');if(mt)T(msg,195,116,9,'#ffe27a','center')}function draw(){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);bg();bar();bartender();beers.forEach(beer);guards.forEach(a=>{if(tick>=a.wake)guy(a.x,true)});guy(p.x);if(drinkFx)T('GLUG!',sx(p.x)+22,G-70,12,'#ffe27a','center');hud();if(state==='win'){R(35,185,320,225,'rgba(12,7,10,.94)');T('LAST CALL COMPLETE!',195,230,19,'#ffe36a','center');T(perfect?'BARROOM LEGEND':'MADE IT TO CLOSING',195,270,13,perfect?'#8cff95':'#fff','center');T('5 BEERS • 25 CHUGS',195,305,11,'#fff','center');T('TAP CHUG TO RETURN',195,380,10,'#ffe27a','center')}}function loop(now){let dt=Math.min(50,now-last);last=now;let steps=Math.max(1,Math.min(3,Math.round(dt/16.67)));for(let i=0;i<steps;i++)step();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
