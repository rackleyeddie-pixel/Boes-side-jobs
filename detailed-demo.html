<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Boe's Side Jobs - Detailed Character Demo</title><style>
html,body{margin:0;width:100%;height:100%;background:#15110d;overflow:hidden;font-family:monospace;touch-action:none;user-select:none;-webkit-user-select:none}*{box-sizing:border-box}.wrap{height:calc(100% - 118px);display:flex;justify-content:center;align-items:center;padding:4px}.game{width:min(100vw,430px);height:100%;position:relative}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#87c8ee;border-radius:14px}.ui{width:min(100vw,430px);height:118px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px calc(16px + env(safe-area-inset-bottom));gap:8px;background:#17130f}.grp{display:flex;gap:8px}.btn{border:2px solid #2d2924;box-shadow:0 4px 0 #060504;background:#ddd;color:#111;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none}.move{width:64px;height:64px;border-radius:16px;font-size:28px}.round{width:74px;height:74px;border-radius:50%;font-size:12px}.work{background:#d29b52}.jump{background:#bcdcff}.swap{width:58px;height:54px;border-radius:12px;font-size:9px}.title{position:absolute;left:50%;top:8px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;background:#0009;color:#fff;font:900 10px monospace;pointer-events:none;white-space:nowrap}@media(max-width:370px){.move{width:56px}.round{width:65px;height:65px}.swap{width:50px}.grp{gap:5px}.ui{gap:5px;padding-left:6px;padding-right:6px}}</style></head><body><div class="wrap"><div class="game"><canvas id="c" width="390" height="650"></canvas><div class="title">DETAILED CHARACTER PLAYABLE DEMO</div></div></div><div class="ui"><div class="grp"><button class="btn move" id="left">◀</button><button class="btn move" id="right">▶</button></div><div class="grp"><button class="btn round work" id="work">WORK</button><button class="btn swap" id="swap">CHAR</button><button class="btn round jump" id="jump">JUMP</button></div></div><script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=390,H=650,G=520,WORLD=1900;let cam=0,t=0,left=0,right=0,jumpHeld=0,sel=0,msg='',mt=0,hp=4,cash=250,parts=[];const names=['BOE','DONNY','JORDAN'],p={x:90,y:G,vx:0,vy:0,on:1,dir:1};const fences=[300,560,820,1080,1340].map(x=>({x,n:0,done:0}));const osha=[{x:720,dir:-1,st:0},{x:1250,dir:-1,st:0}];
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};const T=(s,x,y,z=12,col='#fff',a='left')=>{g.fillStyle=col;g.font='bold '+z+'px monospace';g.textAlign=a;g.fillText(s,x,y)};const sx=x=>x-cam;function P(pts,col){g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill()}function limb(x,y,len,w,ang,col,outline='#241812'){g.save();g.translate(x,y);g.rotate(ang);R(-w/2-1,-1,w+2,len+2,outline);R(-w/2,0,w,len,col);g.restore()}function cloud(x,y,s=.8){R(x,y+8*s,62*s,13*s,'#f5f5ef');R(x+13*s,y,20*s,18*s,'#fff');R(x+29*s,y-7*s,24*s,25*s,'#fff');R(x+47*s,y+2*s,15*s,17*s,'#fff')}function tree(x,y){R(x+18,y-72,10,72,'#5b3e25');R(x+3,y-108,50,43,'#347d3e');R(x+13,y-128,34,38,'#4a9950');R(x-7,y-105,28,28,'#3f8847')}function house(x,y,i){const w=i%2?'#c88961':'#d8a16f',r=i%2?'#4e3224':'#653c27';R(x,y-105,142,95,w);P([[x-10,y-105],[x+71,y-158],[x+152,y-105]],r);R(x+18,y-78,34,32,'#9fd0dc');R(x+89,y-78,34,32,'#86bdca');R(x+59,y-45,28,35,'#6b4b34');R(x,y-10,142,10,'#8b8277')}
function bg(){R(0,0,W,H,'#82c8ef');for(let i=0;i<5;i++)cloud(i*145-((cam*.12)%720)-50,78+(i%2)*38,.75);g.fillStyle='#f5d35e';g.beginPath();g.arc(334,66,18,0,Math.PI*2);g.fill();R(0,320,W,205,'#70a065');for(let i=-1;i<8;i++){let q=i*300-cam*.45;house(q,510,i);tree(q+165,520);R(q+220,478,60,42,'#547b8a');R(q+230,470,40,10,'#678e9a');R(q+228,508,12,12,'#222');R(q+258,508,12,12,'#222')}R(0,G,W,130,'#6f5338');R(0,G-8,W,8,'#4d8d3e');for(let x=0;x<W;x+=22)R(x,G+32,14,2,'#87694a')}
function character(cx,feet,n,phase,air=false){const J=n==='JORDAN',D=n==='DONNY';const s=J?1.08:1;const skin=D?'#c98d65':J?'#d6a177':'#d89e72',hair=D?'#c69b24':J?'#2a211d':'#2e241f',shirt=J?'#e7ca3d':D?'#c24d36':'#c94036',overall=J?'#4e5c69':D?'#5b6672':'#2367a0',shoe=D?'#ece9e1':'#7a4e2b';const moving=Math.abs(p.vx)>.45&&p.on,walk=moving?Math.sin(phase):0,bob=moving?Math.abs(Math.sin(phase))*1.5:0;g.save();g.translate(cx,feet-bob);g.scale(s,s);if(p.dir<0)g.scale(-1,1);const outline='#251912';
// back arm, connected shoulder to hand
limb(-13,-57,23,7,-walk*.35,skin,outline);
// back leg
limb(-8,-30,25,9,walk*.4,overall,outline);g.save();g.translate(-8+Math.sin(walk*.4)*9,-7);g.rotate(-walk*.18);R(-8,-2,18,8,outline);R(-6,0,16,6,shoe);g.restore();
// torso with rounded/pixel-stepped shoulders and waist, not a square
P([[-17,-61],[-12,-67],[12,-67],[17,-61],[17,-34],[12,-29],[-12,-29],[-17,-34]],outline);P([[-15,-60],[-10,-65],[10,-65],[15,-60],[15,-35],[10,-31],[-10,-31],[-15,-35]],shirt);R(-10,-55,20,23,overall);R(-13,-54,4,20,overall);R(9,-54,4,20,overall);R(-7,-52,3,12,'#8dc1e4');R(5,-52,3,12,'#8dc1e4');R(-5,-36,10,3,'#183b59');R(-10,-30,20,4,'#3a2b20');R(-7,-29,14,3,'#a87b3d');
// front leg
limb(8,-30,25,9,-walk*.4,overall,outline);g.save();g.translate(8-Math.sin(walk*.4)*9,-7);g.rotate(walk*.18);R(-8,-2,18,8,outline);R(-6,0,16,6,shoe);g.restore();
// neck
R(-5,-72,10,8,outline);R(-4,-71,8,7,skin);
// pixel-rounded head and ears
R(-14,-91,28,18,outline);R(-11,-96,22,27,outline);R(-13,-89,26,15,skin);R(-10,-94,20,22,skin);R(-16,-86,4,9,outline);R(-15,-85,3,7,skin);R(12,-86,4,9,outline);R(12,-85,3,7,skin);
// hair silhouette
R(-11,-97,19,5,hair);R(-14,-94,8,5,hair);R(6,-94,5,4,hair);R(-13,-90,4,6,hair);if(n==='BOE'){R(-12,-98,18,3,'#a91f24');R(-8,-101,16,4,'#c72b31');R(6,-97,10,4,'#b82027');R(10,-95,8,3,'#8e191e')}
// eyes brows nose mouth beard
R(-8,-87,6,2,'#3b281f');R(3,-87,6,2,'#3b281f');R(-7,-84,5,5,'#f7f7ef');R(3,-84,5,5,'#f7f7ef');R(-5,-83,2,3,n==='BOE'?'#2a7ab8':'#2b241f');R(4,-83,2,3,'#2b241f');R(-1,-81,3,5,'#ad7250');R(0,-78,4,2,'#c68b64');R(-5,-75,11,2,'#7f4e3b');if(n==='BOE'){R(-10,-77,4,6,hair);R(7,-77,4,6,hair);R(-7,-72,14,4,hair)}else R(-4,-73,9,2,'#7a4a39');
// front arm + hand + visible fingers
limb(14,-57,23,7,walk*.35,skin,outline);const hx=14+Math.sin(walk*.35)*9,hy=-34+Math.cos(walk*.35)*2;R(hx-5,hy-2,11,9,outline);R(hx-4,hy-1,9,7,skin);R(hx+2,hy+4,2,4,skin);R(hx-1,hy+4,2,4,skin);R(hx-4,hy+4,2,3,skin);
if(D){R(20,-61,4,18,'#e0c632');R(23,-64,4,10,'#f2df55')}g.restore()}
function fence(j){const q=sx(j.x),y=G-66;R(q,y,8,66,'#6c4528');R(q+70,y,8,66,'#6c4528');for(let i=0;i<5;i++){let col=i<j.n?'#c79255':'#7e5131';R(q+9+i*13,y+8,10,50,col);if(i>=j.n)R(q+11+i*13,y+22,6,4,'#54331f')}R(q+8,y+18,62,6,'#9b673f');R(q+8,y+42,62,6,'#9b673f');R(q+5,y-22,70,13,'#222b');for(let i=0;i<5;i++)R(q+9+i*13,y-18,10,6,i<j.n?'#6ede6b':'#49433b');T(j.done?'FIXED':'FENCE '+j.n+'/5',q+39,y-28,9,j.done?'#9cff91':'#fff','center')}
function drawOSHA(a){const q=sx(a.x),st=(t>>3)&1;character(q,G,'OSHA',t*.08);R(q-17,G-100,38,7,'#fff');R(q-13,G-105,30,7,'#f2d048');T('OSHA',q+2,G-112,8,'#fff','center');if(a.st)T('★',q+2,G-118,16,'#ffe86a','center')}
function particle(x,y){parts.push({x,y,vx:(Math.random()-.5)*2.4,vy:-1-Math.random()*2,l:28})}
function work(){let j=fences.find(z=>!z.done&&Math.abs((z.x+38)-p.x)<88);if(!j){msg='MOVE CLOSER TO A FENCE';mt=60;return}j.n=Math.min(5,j.n+1);for(let i=0;i<8;i++)particle(j.x+38,G-35);msg='FENCE '+j.n+'/5';mt=45;if(j.n===5){j.done=1;cash+=75;msg='REPAIR COMPLETE! +$75';mt=80}}
function hit(){if(hp>0){hp--;msg='OSHA HIT!';mt=60;p.vy=-5;p.on=0;if(hp<=0){hp=4;p.x=90;cash=Math.max(0,cash-50)}}}
function update(){t++;if(mt)mt--;const acc=p.on?.52:.32;if(left){p.vx=Math.max(-4.8,p.vx-acc);p.dir=-1}if(right){p.vx=Math.min(4.8,p.vx+acc);p.dir=1}if(!left&&!right)p.vx*=p.on?.82:.97;p.x+=p.vx;p.vy+=.57;p.y+=p.vy;if(p.y>=G){p.y=G;p.vy=0;p.on=1;jumpHeld=0}p.x=Math.max(10,Math.min(WORLD-30,p.x));cam=Math.max(0,Math.min(WORLD-W,p.x-135));for(const a of osha){if(a.st){a.st--;continue}const d=p.x-a.x;if(Math.abs(d)<350)a.x+=Math.sign(d)*1.0;if(Math.abs(d)<24&&p.y>G-45)hit()}for(const z of parts){z.x+=z.vx;z.y+=z.vy;z.vy+=.09;z.l--}parts=parts.filter(z=>z.l>0)}
function hud(){R(7,7,376,94,'rgba(8,8,8,.82)');T("BOE'S SIDE JOBS",15,28,17,'#ffd65d');T('LEVEL 1: FENCE FIX',15,49,10);T('Jobs '+fences.filter(z=>z.done).length+'/'+fences.length,15,70,11,'#9cff90');T('$'+cash,375,30,15,'#75ff67','right');T('♥'.repeat(hp)+'♡'.repeat(4-hp),375,53,13,'#ff6666','right');T(names[sel],375,77,9,'#ffe168','right');if(mt){R(35,112,320,38,'rgba(0,0,0,.78)');T(msg,195,136,10,'#fff','center')}}
function draw(){bg();fences.forEach(fence);osha.forEach(drawOSHA);for(const z of parts)R(sx(z.x),z.y,3,3,'#ffe76c');character(sx(p.x),p.y,names[sel],t*.16,!p.on);hud();requestAnimationFrame(loop)}function loop(){update();draw()}
function bind(el,key,val){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);if(key==='l')left=1;else right=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();if(key==='l')left=0;else right=0}))}bind(document.getElementById('left'),'l');bind(document.getElementById('right'),'r');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(p.on){p.vy=-10.8-Math.min(Math.abs(p.vx)*.22,1.1);p.on=0;jumpHeld=1}});document.getElementById('work').addEventListener('pointerdown',e=>{e.preventDefault();work()});document.getElementById('swap').addEventListener('pointerdown',e=>{e.preventDefault();sel=(sel+1)%3;msg='CHARACTER: '+names[sel];mt=55});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});loop()})();
